function addCams(){qa('#cvs section.v').forEach(s=>{if(s.querySelector(':scope>.cam2'))return;s.classList.add('hascam');const b=document.createElement('button');b.type='button';b.className='cam2';b.title='ถ่ายรูปส่วนนี้ (วาง LINE ได้)';b.textContent='📷';b.onclick=e=>{e.stopPropagation();shoot([s])};s.appendChild(b)})}
new MutationObserver(addCams).observe(document.getElementById('cvs')||document.body,{childList:true,subtree:false});
async function shoot(secs,allPage){if(typeof htmlToImage==='undefined'){msg('ถ่ายรูปไม่ได้');return}msg('กำลังสร้างรูป...');
 const ttl=(q('.hdr h1')||{}).textContent||document.title,asof=(q('#asof')||{}).textContent||'',crumb=q('.crumb b')?q('.crumb b').textContent:'';
 const box=document.createElement('div');box.style.cssText='position:fixed;left:0;top:0;z-index:-1;pointer-events:none;background:#fff;padding:14px 16px 26px;display:grid;gap:10px;font-family:"Segoe UI",Arial';
 let W=0;const parts=secs.map(s=>{const c=s.cloneNode(true);c.querySelectorAll('.cam2,.note,.xf,#sgM,#sgDG,#xAll,#xNo,.seg,.tb').forEach(x=>x.remove());c.style.boxShadow='none';c.style.gridRow='auto';
  c.querySelectorAll('.scroll').forEach(x=>{x.style.overflow='visible'});c.querySelectorAll('table').forEach(t=>{t.style.zoom=''});c.querySelectorAll('th,td').forEach(x=>{x.style.position=x.classList.contains('db')?'relative':'static'});
  const t=s.querySelector('table'),w=Math.max(s.clientWidth,t?Math.round(t.scrollWidth/(parseFloat(t.style.zoom)||1))+40:0);W=Math.max(W,w);
  const sv=s.querySelector('svg'),cs=c.querySelector('svg');if(sv&&cs){cs.setAttribute('width',sv.clientWidth);cs.setAttribute('height',sv.clientHeight)}return c});
 W=Math.min(W,2400);box.style.width=(W+32)+'px';
 const hd=document.createElement('div');hd.style.cssText='font-size:13px;color:#12239E;font-weight:600';hd.textContent=ttl+(crumb?' · '+crumb:'');
 const sb=document.createElement('div');sb.style.cssText='font-size:11.5px;color:#605E5C;margin-top:-6px';sb.textContent=asof;box.append(hd,sb,...parts);document.body.appendChild(box);{const TB=[...box.querySelectorAll('table')];box.style.width='max-content';TB.forEach(t=>t.style.width='max-content');const bw=box.offsetWidth;box.style.width=Math.min(4000,Math.max(W+32,bw+8))+'px';TB.forEach(t=>t.style.width='100%');W=parseInt(box.style.width)-32}
 const H=box.scrollHeight,pr=Math.max(1,Math.min(4,16000/Math.max(H,W+32),MOB()?Math.sqrt(16e6/((W+32)*H)):4));let blob=null;
 try{blob=await htmlToImage.toBlob(box,{pixelRatio:pr,backgroundColor:'#FFFFFF'})}catch(e){console.log(e)}finally{box.remove()}
 if(!blob){msg('สร้างรูปไม่สำเร็จ');return}
 if(!MOB()){try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);msg('คัดลอกรูปแล้ว · วางใน LINE ได้ทันที (Ctrl+V)');return}catch(e){}}
 const u=URL.createObjectURL(blob),file=new File([blob],'dashboard.png',{type:'image/png'}),can=!!(navigator.canShare&&navigator.canShare({files:[file]})),sh=q('#camSheet');
 q('.bx',sh).innerHTML=`<b>รูปพร้อมแล้ว</b><div style="color:#605E5C">${can?'กด "ส่งไป LINE / แชร์รูป" หรือ':''} กดค้างที่รูปเพื่อบันทึก / คัดลอก</div><img alt="" src="${u}"><div class="bt">${can?'<button class="pr" data-a="s" type="button">ส่งไป LINE / แชร์รูป</button>':''}<button data-a="c" type="button">คัดลอกรูป</button><button data-a="x" type="button">ปิด</button></div>`;sh.style.display='flex';
 sh.onclick=e=>{if(e.target===sh)sh.style.display='none'};
 qa('button',sh).forEach(b=>b.onclick=async()=>{const a=b.dataset.a;if(a==='x'){sh.style.display='none';return}
  if(a==='s'){try{await navigator.share({files:[file],text:ttl+' · '+asof})}catch(e){}return}
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);msg('คัดลอกรูปแล้ว')}catch(e){msg('อุปกรณ์นี้คัดลอกไม่ได้ — กดค้างที่รูปแทน')}})}
const pb=document.getElementById('bShot');if(pb){pb.onclick=e=>{e.stopImmediatePropagation();shoot(qa('#cvs section.v'),true)};pb.textContent='📷 ถ่ายรูปทั้งหน้า'}
window.__shoot=shoot;
}
</script>
</body></html>
