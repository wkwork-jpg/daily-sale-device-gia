<style>
.v>.cam2{position:absolute;top:8px;right:8px;border:1px solid #C8C6C4;background:#fff;border-radius:4px;padding:2px 8px;font-size:13px;min-height:28px;z-index:3;opacity:.55;cursor:pointer}
.v:hover>.cam2,.v>.cam2:focus-visible{opacity:1}@media (hover:none){.v>.cam2{opacity:1}}
.v.hascam>.vt{padding-right:44px}
#camSheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:90;padding:12px}
#camSheet .bx{background:#fff;border-radius:8px;padding:14px;max-width:min(96vw,1000px);max-height:92vh;overflow:auto;width:100%;font:13px/1.4 "Segoe UI",Arial}
#camSheet img{max-width:100%;border:1px solid #E1DFDD;display:block;margin:8px auto}#camSheet .bt{display:flex;gap:8px;flex-wrap:wrap}
#camSheet button{border:1px solid #C8C6C4;background:#fff;border-radius:4px;padding:7px 14px;font:inherit;min-height:40px}#camSheet button.pr{background:#E6F2FF;border-color:#118DFF;color:#0B5CAD;font-weight:600}

/* ชื่อสาขาไม่ตัดบรรทัด (28 พ.ย.) */tbody td.l:first-child,tbody td.l:nth-child(2),tbody td.l:nth-child(3),td.wr2,td.l.wr2{white-space:nowrap!important;max-width:none!important}

/* TOP/BOTTOM แบบกะทัดรัด (28 พ.ย.) */.tq{padding:2px 0!important;font-size:12px!important;gap:4px!important}.tq .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}.tq .nm small{display:inline!important;margin-left:6px}.tq .vv{white-space:nowrap}.tq .vv small{display:inline!important;margin-left:5px}.tq .cf{padding:0 4px}.tbv .vt{margin-bottom:2px}

/* ปุ่มกล้องไม่ทับตาราง (28 พ.ย.) */.cam2{top:6px!important;right:8px!important;min-height:24px!important;height:24px;padding:0 7px!important;font-size:12px!important;line-height:22px}.hascam>.vt{padding-right:46px;min-height:26px;margin-bottom:6px!important}

/* แถบหัวข้อ/แท็บ ตรงแนวเนื้อหา (28 พ.ย.) */.tabs,.hdr{padding-left:max(10px,calc((100% - 1500px)/2 + 10px))!important;padding-right:max(10px,calc((100% - 1500px)/2 + 10px))!important}

<script>
{
const q=(s,r=document)=>r.querySelector(s),qa=(s,r=document)=>[...r.querySelectorAll(s)];

function addCams(){qa('#cvs section.v').forEach(s=>{if(s.querySelector(':scope>.cam2'))return;s.classList.add('hascam');const b=document.createElement('button');b.type='button';b.className='cam2';b.title='ถ่ายรูปส่วนนี้ (วาง LINE ได้)';b.textContent='📷';b.onclick=e=>{e.stopPropagation();shoot([s])};s.appendChild(b)})}
