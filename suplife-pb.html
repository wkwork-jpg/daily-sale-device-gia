<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suplife Powerbank — Daily Target</title>
<style>
:root{--hdr:#334155;--hdr2:#475569;--bg:#F6F7F9;--sel:#F1F5F9;--selB:#475569;--ink:#1E293B;--mut:#64748B;--line:#E2E8F0;--today:#EEF2F7;--act:#FEF6E7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Thai',Tahoma,sans-serif;color:var(--ink);background:var(--bg);font-size:12.5px;font-variant-numeric:tabular-nums}
.rb{background:#fff;border-top:3px solid var(--hdr);box-shadow:0 1px 0 var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.rb h1{margin:0;font-size:18px;color:var(--hdr);display:flex;align-items:center;gap:8px}.rb h1 .ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--sel)}
.gap{flex:1}#stat{font-size:11.5px;color:var(--mut);text-align:right;line-height:1.5}#stat b{color:var(--ink)}
.tabs{display:flex;gap:8px;padding:10px 20px 0;flex-wrap:wrap;align-items:center}.tabs a{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700;color:var(--ink)}.tabs a.on{background:var(--sel);border:2px solid var(--selB)}
.flt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ms{position:relative}.ms-b{border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--ink)}
.ms-l{color:var(--mut);font-size:11px}.ms-v{font-weight:700}
.ms-p{position:absolute;left:0;top:110%;background:#fff;border:1px solid #CBD5E1;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);width:250px;padding:8px;z-index:50}
.ms-q,.sq{padding:6px 8px;border:1px solid #CBD5E1;border-radius:6px;font:inherit}.ms-q{width:100%}.ms-a{display:flex;gap:12px;margin:6px 2px;font-size:12px}.ms-a a{color:var(--hdr2);cursor:pointer;text-decoration:underline}
.ms-o{max-height:240px;overflow:auto}.ms-o label{display:flex;gap:6px;padding:4px;cursor:pointer}.ms-o label:hover{background:#F1F5F9}
.wrap{padding:14px 20px 30px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chips span{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 11px;color:var(--mut)}.chips b{color:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;margin-bottom:8px}
.card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--hdr);border-radius:10px;padding:12px 14px}
.card h3{margin:0;font-size:13px;color:var(--hdr)}.card .sub{color:var(--mut);font-size:11px;margin-top:2px}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}.card .v{font-size:26px;font-weight:700;color:var(--hdr)}.card .v small{font-size:13px;color:var(--mut);font-weight:400}
.badge{border-radius:14px;padding:3px 10px;font-weight:700;background:#F1F5F9;color:var(--hdr)}
.bar{height:7px;background:#E9EEF3;border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#64748B}
.ln{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:8px}
.title{font-size:16px;font-weight:700;color:var(--hdr);margin:18px 0 2px;padding-left:9px;border-left:4px solid var(--hdr)}.stt{color:var(--mut);margin:0 0 8px 13px}
.scroll{overflow-x:auto;background:#fff;border-radius:10px;border:1px solid #CBD5E1}
.xl{border-collapse:collapse;width:100%}
.xl th{background:var(--hdr);color:#fff;font-weight:700;padding:6px 6px;border:1px solid #475569;white-space:nowrap;font-size:12px}.xl thead tr:nth-child(2) th{background:var(--hdr2)}
.xl td{padding:5px 6px;border:1px solid #E9EDF2;white-space:nowrap}.xl tbody tr:nth-child(even) td{background:#FAFBFC}.xl tbody tr:hover td{background:#F1F5F9}
.xl tfoot td{background:var(--hdr)!important;color:#fff!important;font-weight:700;border-color:#475569}
.r{text-align:right}.c{text-align:center}.l{text-align:left}.b{font-weight:700}.sep{border-left:2px solid #94A3B8!important}
.xl tbody td.td{background:var(--today)!important;font-weight:700}.xl tbody td.act{background:var(--act)!important;color:#334155;font-weight:700}
.xl tbody td.g{background:#DCEFE2!important;color:#1E6B3A!important;font-weight:700}.xl tbody td.rd{background:#FCD2C3!important;color:#9A3412!important;font-weight:700}
.xl tbody td.oos{background:#FBE1DE!important;color:#A8261E!important;font-weight:700}.z{color:#B4BDC8}
.rkt1,.rkt{background:#DCEFE2!important;color:#1E6B3A;font-weight:700}.rkm{background:#FFF6D6!important;color:#7A5A00}.rkb,.rkb1{background:#FBE1DE!important;color:#A8261E;font-weight:700}
.note{color:var(--mut);font-size:11px;margin-top:14px;line-height:1.6}
.xl th.wh{white-space:normal;min-width:60px;max-width:84px;line-height:1.2;font-size:11px}
.xl th.wh2{white-space:normal;min-width:84px;max-width:120px;line-height:1.2;font-size:11px}
.wr{white-space:normal!important;min-width:120px;max-width:190px;line-height:1.25}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99}
#gate form{background:#fff;padding:26px 28px;border-radius:14px;border-top:4px solid var(--hdr);box-shadow:0 10px 30px rgba(16,24,40,.10);text-align:center;width:330px}
#gate input{width:100%;padding:9px;border:1px solid #CBD5E1;border-radius:8px;font:inherit;margin:14px 0 10px}#gate button{width:100%;padding:9px;border:1px solid var(--selB);background:var(--sel);color:var(--hdr);border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
#gate .msg{color:var(--mut);font-size:12px;margin-top:8px;min-height:16px}
@media(max-width:900px){.kp{grid-template-columns:1fr 1fr}}
.prc{font-size:11.5px;font-weight:600;opacity:.85;margin-top:2px;white-space:nowrap}
.rawdl{border:1px solid #475569;background:#F1F5F9;color:#334155;border-radius:8px;padding:5px 12px;font-weight:600;cursor:pointer;font:inherit;font-size:12.5px}
</style></head><body>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:0}),Q=v=>v==null||isNaN(v)?'–':nf.format(Math.round(v)),T1=v=>v==null||!isFinite(v)?'–':v.toFixed(1);
const pct=v=>v==null||!isFinite(v)?'–':(v*100).toFixed(1)+'%';
const TH=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dTH=d=>`${+d.slice(8)} ${TH[+d.slice(5,7)-1]}`,dw=d=>DW[new Date(d+'T00:00:00').getDay()];
const REL=(v,b)=>v==null||!isFinite(v)||b==null||!(b>0)?'':v>=b*1.1?'g':v<=b*.85?'rd':'';
function rkC(rk,n){if(!rk||n<2)return'';const g=n<=3?1:n>30?Math.max(3,Math.round(n*.1)):3;if(rk<=g)return'rkt';if(rk>n-g)return'rkb';return'rkm'}
async function unlock(pw){const raw=Uint8Array.from(atob($('#data').textContent.trim()),c=>c.charCodeAt(0));
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:raw.slice(0,16),iterations:250000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},key,raw.slice(28));
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
let D=null,TAB='area',SQ='';const PO=()=>[...D.skus.keys()].sort((a,b)=>((D.prices||[])[a]||1e9)-((D.prices||[])[b]||1e9)||D.skus[a].localeCompare(D.skus[b])),PRC=k=>D.prices&&D.prices[k]?`<div class="prc">${Q(D.prices[k])} บาท</div>`:'';const F={reg:[],area:[],type:[]};
const builtStr=s=>{s=String(s||'');return s.length>=16?`${dTH(s.slice(0,10))} ${s.slice(11,16)}`:s};
/* สัดส่วนเวลาของวันที่ยังไม่จบ (10:00–21:00) */
function dayTF(d){const b=String(D.built||'');if(b.slice(0,10)!==d)return 1;const h=+b.slice(11,13)+(+b.slice(14,16))/60;return h>=21?1:Math.min(1,Math.max(.15,(h-10)/11))}
const ND=()=>D.days.length,EL=()=>D.have.filter(Boolean).length,ELT=()=>D.days.reduce((a,d,j)=>a+(D.have[j]?dayTF(d):0),0);
function shopRow(s){const _r=shopRow0(s);_r.sku=s[5];_r.skuSt=s[6];_r.dk=s[7];return _r}
function shopRow0(s){const tot=s[4].reduce((a,b)=>a+b,0),stk=s[6].reduce((a,b)=>a+b,0);return{code:s[0],name:s[1],area:s[2],type:s[3],reg:D.regs[s[2]]||'',d:s[4],tot,stk,cnt:1}}
function agg(L,lab){const o={lab,d:Array(ND()).fill(0),tot:0,stk:0,cnt:L.length};L.forEach(s=>{s.d.forEach((v,j)=>o.d[j]+=v);o.tot+=s.tot;o.stk+=s.stk});return o}
function msel(host,label,opts,sel,onch){host.classList.add('ms');const draw=()=>{host.innerHTML=`<button type="button" class="ms-b"><span class="ms-l">${label}</span><span class="ms-v">${sel.length?(sel.length===1?esc(sel[0]):sel.length+' selected'):'All'}</span><span>▾</span></button><div class="ms-p" hidden><input class="ms-q" placeholder="Search..."><div class="ms-a"><a data-x="all">Select all</a><a data-x="none">Clear</a></div><div class="ms-o">${opts.map(o=>`<label><input type="checkbox" value="${esc(o)}" ${sel.includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div></div>`;
  const p=$('.ms-p',host);$('.ms-b',host).onclick=e=>{e.stopPropagation();$$('.ms-p').forEach(x=>{if(x!==p)x.hidden=true});p.hidden=!p.hidden;if(!p.hidden){const r=p.getBoundingClientRect();if(r.right>innerWidth-8){p.style.left='auto';p.style.right='0'}}};p.onclick=e=>e.stopPropagation();
  $('.ms-q',host).oninput=e=>{const q=e.target.value.toLowerCase();$$('.ms-o label',host).forEach(l=>l.style.display=l.textContent.toLowerCase().includes(q)?'':'none')};
  $$('.ms-a a',host).forEach(a=>a.onclick=()=>{sel.length=0;if(a.dataset.x==='all')$$('.ms-o label',host).filter(l=>l.style.display!=='none').forEach(l=>sel.push($('input',l).value));onch();draw();$('.ms-p',host).hidden=false});
  $$('.ms-o input',host).forEach(c=>c.onchange=()=>{const i=sel.indexOf(c.value);if(c.checked&&i<0)sel.push(c.value);if(!c.checked&&i>=0)sel.splice(i,1);onch();$('.ms-v',host).textContent=sel.length?(sel.length===1?sel[0]:sel.length+' selected'):'All'})};draw()}
document.addEventListener('click',()=>$$('.ms-p').forEach(x=>x.hidden=true));
function filters(){const f=$('#flt');f.innerHTML='';if(TAB==='area')return;const MT=TAB==='model';const S=D.shops.map(shopRow);
  const mk=(k,lab,opts)=>{const d=document.createElement('div');f.appendChild(d);msel(d,lab,opts,F[k],render)};
  if(TAB==='all'||MT)mk('reg','Region',['BMA','UPC I','UPC II']);
  mk('area','Area',[...new Set(S.filter(s=>TAB==='all'||MT||/^BMA (III|IV)/.test(s.area)).map(s=>s.area))].sort());
  mk('type','Type Shop',[...new Set(S.map(s=>s.type))].sort());
  if(TAB==='all'){const i=document.createElement('input');i.className='sq';i.placeholder='Search shop...';i.value=SQ;i.oninput=()=>{SQ=i.value;const p=i.selectionStart;render();const j=$('#flt .sq');j.focus();j.setSelectionRange(p,p)};f.appendChild(i)}}

const GP=v=>{const r=Math.round(v);return (r>0?'+':'')+Q(r)};
const DL=d=>`${dw(d)} ${dTH(d)}`;
function card(t,sub,v,tg,extra){return `<div class="card"><h3>${t}</h3><div class="sub">${sub}</div><div class="row"><div class="v">${Q(v)} ${tg==null?'':`<small>/ Target ${Q(tg)}</small>`}</div>${tg?`<span class="badge">${pct(v/tg)}</span>`:''}</div>${tg?`<div class="bar"><i style="width:${Math.min(100,100*v/tg)}%"></i></div>`:''}<div class="ln">${extra||''}</div></div>`}
const CLR=h=>h.replace(/class="([^"]*)"/g,(m,c)=>`class="${c.replace(/\b(g|rd|oos|td|act|z)\b/g,'')}"`);
function renderArea(){const S=D.shops.map(shopRow),T=D.target,n=ND(),NA=D.areas.length,elt=ELT();
  const R=D.areas.map(a=>agg(S.filter(s=>s.area===a),a));const tot=agg(S,'TOTAL 15 Area');
