<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:0}),Q=v=>v==null||isNaN(v)?'–':nf.format(Math.round(v)),T1=v=>v==null||!isFinite(v)?'–':v.toFixed(1);
const pct=v=>v==null||!isFinite(v)?'–':(v*100).toFixed(1)+'%';
const TH=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dTH=d=>`${+d.slice(8)} ${TH[+d.slice(5,7)-1]}`,dw=d=>DW[new Date(d+'T00:00:00').getDay()];
const REL=(v,b)=>v==null||!isFinite(v)||b==null||!(b>0)?'':v>=b*1.1?'g':v<=b*.85?'rd':'';
function rkC(rk,n){if(!rk||n<2)return'';const g=n<=3?1:n>30?Math.max(3,Math.round(n*.1)):3;if(rk<=g)return'rkt';if(rk>n-g)return'rkb';return'rkm'}
async function unlock(pw){const raw=Uint8Array.from(atob($('#data').textContent.trim()),c=>c.charCodeAt(0));
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:raw.slice(0,16),iterations:250000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
