</style>
<script>
{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:0}),Q=v=>v==null||!isFinite(v)?'–':nf.format(Math.round(v)),P=v=>v==null||!isFinite(v)?'–':(v*100).toFixed(1)+'%',
 SG=v=>v==null||!isFinite(v)?'–':(Math.round(v)>0?'+':'')+nf.format(Math.round(v));
const DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],dw=d=>DW[new Date(d+'T00:00:00').getDay()],dn=d=>+d.slice(8),dmy=d=>dn(d)+' '+MN[+d.slice(5,7)-1];
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2800)};
const HS=v=>{if(v==null||!isFinite(v))return '';const x=Math.max(0,Math.min(1.2,v));let h,l;if(x<.5){h=4+x/.5*30;l=91}else if(x<1){h=34+(x-.5)/.5*16;l=90}else{h=212;l=90-(x-1)*20};return `background:hsl(${h.toFixed(0)},85%,${l.toFixed(0)}%);color:hsl(${h.toFixed(0)},70%,${x<1?32:30}%)`};
const pc=(v,cls)=>`<td class="${cls||''}"><span class="cfh" style="${HS(v)}">${P(v)}</span></td>`;
const PCOL=['#12239E','#E66C37','#6B007B'],BCOL=['#118DFF','#12239E','#E66C37','#6B007B','#E044A7','#744EC2','#D9B300','#D64550','#197278','#1AAB40','#3599B8','#8D6E63','#5F6B6D'];
let D=null,U='q',PG='ov',DP=0,SHF='f34',STF='f34',STQ='',SORT={pg:'',c:'',d:1},BRV='a';
let SH=[],AR=[],RG=['BMA','UPC II','UPC I'],ND=0,JL=0,TF=1,EL=1,DIM=30,MAP=[];
/* ---------- model ---------- */
function base(){ND=D.days.length;DIM=D.dim||30;JL=Math.max(0,D.days.indexOf(D.last));
 const b=String(D.built||''),h=+b.slice(11,13)+(+b.slice(14,16))/60;TF=(b.slice(0,10)===D.last&&h<21)?Math.min(1,Math.max(.15,(h-10)/11)):1;EL=JL+TF;
 SH=D.shops.map((s,i)=>({i,code:s[0],name:s[1],area:s[2],type:s[3],reg:s[4]}));
 AR=D.areas.map(a=>({name:a,reg:SH.find(s=>s.area===a)?.reg||''}));
 MAP=D.P.map((p,k)=>{const m=new Map();(D.d[k]||[]).forEach(([si,q,n])=>m.set(si,{q,n}));return m})}
const z=()=>Array(ND).fill(0);
function S(L,k){/* L = shop index list */const m=MAP[k],t=D.t[k],a=z();let T=0;L.forEach(i=>{const x=m.get(i);if(x){const v=U==='q'?x.q:x.n;for(let j=0;j<ND;j++)a[j]+=v[j]||0}if(t)T+=(U==='q'?t[0][i]:t[1][i])||0});
 const A=a.slice(0,JL+1).reduce((x,y)=>x+y,0),td=a[JL]||0,hasT=!!t&&T>0,TM=hasT?T*EL/DIM:null,RR=A/Math.max(EL,.01)*DIM;
 return{a,A,td,T:hasT?T:null,TM,ach:hasT?A/TM:null,rr:hasT?RR/T:null,gap:hasT?A-TM:null,need:hasT?Math.max(0,T-A)/Math.max(.5,DIM-EL):null,tday:hasT?T/DIM:null,RRv:RR}}
const shopsOf=(f)=>SH.filter(f).map(s=>s.i);
const areaL=a=>shopsOf(s=>s.area===a),regL=r=>shopsOf(s=>s.reg===r),allL=()=>SH.map(s=>s.i);
const UL=()=>U==='q'?'QTY':'NET (THB)';
/* ---------- shared ---------- */
const RB=(n,N)=>{const h=Math.round(125*(1-(n-1)/Math.max(1,N-1)));return `<span class="rkb" style="background:hsl(${h},70%,${n<=3||n>N-3?80:88}%);color:hsl(${h},75%,24%);border:1px solid hsl(${h},55%,62%)">${n}</span>`};
const sec=(id,title,sub,body,extra)=>`<section class="v c12" id="${id}"><div class="vt">${title} <small>${sub||''}</small>${extra?'<span style="flex:1"></span>'+extra:''}</div>${body}</section>`;
const seg=(id,opts,cur)=>`<div class="seg" id="${id}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${String(cur)===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
const asofTxt=()=>`Month ${MN[+D.month.slice(5)-1]} ${D.month.slice(0,4)} · Sales data to ${dmy(D.last)} · Updated ${D.built} · Day ${(EL).toFixed(1)} / ${DIM}`;
/* ---------- Overview ---------- */
function card(k){const s=S(allL(),k),p=D.P[k];const c=PCOL[k]||'#12239E';
 return `<div class="pc" style="--pcc:${c}"><div class="pt"><span>${esc(p.l)}</span><small style="color:#605E5C;font-weight:500">${UL()}</small></div>
 <div class="big"><b>${Q(s.A)}</b><span>Actual MTD · Target ${Q(s.T)}</span></div>
 <div class="pbar"><i style="width:${Math.min(100,s.T?s.A/s.T*100:0)}%"></i><s style="left:${Math.min(100,EL/DIM*100)}%"></s></div>
 <div class="kv"><div>%ACH MTD<b><span class="cfh" style="${HS(s.ach)}">${P(s.ach)}</span></b></div><div>Forecast (RR)<b>${Q(s.RRv)}</b></div><div>Today ${dn(D.last)}<b>${Q(s.td)}</b></div>
 <div>Target MTD<b>${Q(s.TM)}</b></div><div>GAP MTD<b class="${(s.gap||0)<-.5?'neg':''}">${SG(s.gap)}</b></div><div>Need/Day<b>${s.need==null?'–':Q(Math.ceil(s.need))}</b></div></div></div>`}
function rowCells(L,big,mx){return [0,1,2].map(k=>{const s=S(L,k);return `<td class="gs">${Q(s.T)}</td><td>${Q(s.TM)}</td><td class="acb">${Q(s.A)}</td>${pc(s.ach)}<td>${Q(s.RRv)}</td><td class="${(s.gap||0)<-.5?'neg':''}">${SG(s.gap)}</td><td class="tdw">${Q(s.td)}</td>`}).join('')}
function head3(first){return `<thead><tr>${first}${[0,1,2].map(k=>`<th colspan="7" class="gs gt" style="--gc:${PCOL[k]}">${esc(D.P[k].l)}</th>`).join('')}</tr><tr>${[0,1,2].map(()=>`<th class="gs">Target<br>Month</th><th>Target<br>MTD</th><th>Actual<br>MTD</th><th>%ACH<br>MTD</th><th>Forecast<br>(RR)</th><th>GAP<br>MTD</th><th>Today<br>${dn(D.last)}</th>`).join('')}</tr></thead>`}
function pgOV(){const rk=[0,1,2].map(k=>{const L=AR.map(a=>({a:a.name,s:S(areaL(a.name),k)})).sort((x,y)=>(y.s.ach??-1)-(x.s.ach??-1));const m={};L.forEach((x,i)=>m[x.a]=i+1);return{L,m}});
 const tbR=`<table>${head3('<th class="l" rowspan="2">Region</th>')}<tbody>${RG.map(r=>`<tr><td class="l"><a href="#" class="lk gor" data-r="${r}" style="font-weight:600">${r}</a> <span class="sm3">(${AR.filter(a=>a.reg===r).length} Area)</span></td>${rowCells(regL(r))}</tr>`).join('')}<tr class="tt"><td class="l">TOTAL</td>${rowCells(allL())}</tr></tbody></table>`;
 const tbA=`<table>${head3('<th class="l" rowspan="2">Region</th><th class="l" rowspan="2">Area</th><th rowspan="2">Rank<br>Device</th>')}<tbody>${RG.map(r=>AR.filter(a=>a.reg===r).map((a,n)=>`<tr${n===0?' class="g1"':''}><td class="l sm3">${r}</td><td class="l"><a href="#" class="lk goa" data-a="${esc(a.name)}" style="font-weight:600">${esc(a.name)}</a></td><td class="c">${RB(rk[0].m[a.name],AR.length)}</td>${rowCells(areaL(a.name))}</tr>`).join('')).join('')}<tr class="tt"><td class="l" colspan="3">TOTAL (${AR.length} Area)</td>${rowCells(allL())}</tr></tbody></table>`;
 const tb3=`<div class="tb3">${[0,1,2].map(k=>{const L=rk[k].L;const li=(x,n)=>`<div class="tq"><span>${RB(n,L.length)}</span><span class="nm">${esc(x.a)}</span><span class="vv"><span class="cfh" style="${HS(x.s.ach)}">${P(x.s.ach)}</span><small>${Q(x.s.A)}</small></span></div>`;
  return `<div><div class="hh" style="color:${PCOL[k]}">${esc(D.P[k].l)}</div><div class="tbl2"><div><div class="tl ok">▲ TOP 3</div>${L.slice(0,3).map((x,i)=>li(x,i+1)).join('')}</div><div><div class="tl lw">▼ BOTTOM 3</div>${L.slice(-3).reverse().map((x,i)=>li(x,L.length-i)).join('')}</div></div></div>`}).join('')}</div>`;
 return sec('pOV1',`Overview — ${MN[+D.month.slice(5)-1]} ${D.month.slice(0,4)}`,`Nationwide · ${UL()} · %ACH MTD = Actual ÷ Target ตามวันที่ผ่านไป (${EL.toFixed(1)}/${DIM} วัน) · Forecast (RR) = Actual ÷ วันที่ผ่านไป × วันของเดือน`,`<div class="pcg">${[0,1,2].map(card).join('')}</div>`)+
  sec('pOV4','TOP 3 / BOTTOM 3','by Area · %ACH MTD',tb3)+
  sec('pOV2','By Region','BMA · UPC II · UPC I · click a Region to see its shops',`<div class="scroll">${tbR}</div>`)+
  sec('pOV3','By Area','15 Area · Rank by Device %ACH · click an Area to see its shops',`<div class="scroll">${tbA}</div>`)}
/* ---------- Daily ---------- */
function pgDY(){const k=DP,cols=D.days.map((d,j)=>j),mxA=[];
 const rowsA=AR.map(a=>({a,s:S(areaL(a.name),k)})),mx=Math.max(1,...rowsA.flatMap(x=>x.s.a.slice(0,JL+1))),rR=RG.map(r=>({r,s:S(regL(r),k)})),mxR=Math.max(1,...rR.flatMap(x=>x.s.a.slice(0,JL+1))),T=S(allL(),k);
 const HM=(v,m,j,td)=>{if(j>JL)return '<td class="hm fu">·</td>';if(!v)return '<td class="hm" style="color:#C8C6C4">0</td>';const a=Math.min(1,v/m);return `<td class="hm" style="background:hsl(214,${(60+a*20).toFixed(0)}%,${(95-a*22).toFixed(0)}%);color:#12239E;font-weight:600">${Q(v)}</td>`};
 const hd=first=>`<thead><tr>${first}<th class="gs">Target<br>/Day</th><th class="acbh">Actual<br>MTD</th><th>%ACH<br>MTD</th>${D.days.map((d,j)=>`<th class="hmh ${j===0?'gs':''}">${dw(d).slice(0,2)}<br>${dn(d)}</th>`).join('')}</tr></thead>`;
 const cells=(s,m)=>`<td class="gs">${Q(s.tday)}</td><td class="acb">${Q(s.A)}</td>${pc(s.ach)}${s.a.map((v,j)=>m?HM(v,m,j).replace(j===0?'class="hm':'@@','class="gs hm'):`<td class="hm${j===0?' gs':''}">${j>JL?'·':Q(v)}</td>`).join('')}`;
 const tR=`<table>${hd('<th class="l" rowspan="1">Region</th>')}<tbody>${rR.map(x=>`<tr><td class="l"><b>${x.r}</b></td>${cells(x.s,mxR)}</tr>`).join('')}<tr class="tt"><td class="l">TOTAL</td>${cells(T,0)}</tr></tbody></table>`;
 const tA=`<table>${hd('<th class="l">Region</th><th class="l">Area</th>')}<tbody>${RG.map(r=>rowsA.filter(x=>x.a.reg===r).map((x,n)=>`<tr${n===0?' class="g1"':''}><td class="l sm3">${r}</td><td class="l"><a href="#" class="lk goa" data-a="${esc(x.a.name)}" style="font-weight:600">${esc(x.a.name)}</a></td>${cells(x.s,mx)}</tr>`).join('')).join('')}<tr class="tt"><td class="l" colspan="2">TOTAL (${AR.length} Area)</td>${cells(T,0)}</tr></tbody></table>`;
 const sel=seg('sgDP',D.P.map((p,i)=>[i,p.l]).slice(0,3),k)+`<select id="selBR" class="tb" style="margin-left:6px"><option value="">Device by Brand…</option>${D.P.map((p,i)=>p.g==='brand'?`<option value="${i}" ${i===k?'selected':''}>${esc(p.l)}</option>`:'').join('')}</select>`;
 const W=Math.max(320,ND*26),Hh=200,mxv=Math.max(1,...T.a.slice(0,JL+1),T.tday||0)*1.15,X=j=>40+(W-50)*(j+.5)/ND,Y=v=>10+(Hh-40)*(1-v/mxv),bw=Math.max(4,(W-50)/ND*.6);
 const svg=`<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:${Hh}px" preserveAspectRatio="none">${[0,.25,.5,.75,1].map(f=>`<line x1="40" x2="${W-10}" y1="${Y(mxv/1.15*f)}" y2="${Y(mxv/1.15*f)}" stroke="#EDEBE9"/><text x="36" y="${Y(mxv/1.15*f)+4}" font-size="10" text-anchor="end" fill="#605E5C">${Q(mxv/1.15*f)}</text>`).join('')}
  ${T.a.map((v,j)=>j>JL?'':`<rect x="${X(j)-bw/2}" y="${Y(v)}" width="${bw}" height="${Y(0)-Y(v)}" fill="${PCOL[k]||BCOL[k%BCOL.length]}" rx="2"/>`).join('')}
  ${T.tday?`<line x1="40" x2="${W-10}" y1="${Y(T.tday)}" y2="${Y(T.tday)}" stroke="#252423" stroke-dasharray="5 4"/><text x="${W-12}" y="${Y(T.tday)-4}" font-size="10.5" text-anchor="end" fill="#252423">Target/Day ${Q(T.tday)}</text>`:''}
  ${D.days.map((d,j)=>`<text x="${X(j)}" y="${Hh-14}" font-size="9.5" text-anchor="middle" fill="${j>JL?'#C8C6C4':'#605E5C'}">${dn(d)}</text>`).join('')}</svg>`;
 return sec('pDY0',`Daily Sales — ${esc(D.P[k].l)}`,`${UL()} · Nationwide`,svg,sel)+
  sec('pDY1','By Region — daily',`${UL()} · darker = more`,`<div class="scroll">${tR}</div>`)+
  sec('pDY2','By Area — daily',`${UL()} · darker = more · click an Area to see its shops`,`<div class="scroll">${tA}</div>`)}
/* ---------- Device by Brand ---------- */
function pgBR(){const B=D.P.map((p,i)=>i).filter(i=>D.P[i].g==='brand'&&(S(allL(),i).A||S(allL(),i).T));
 const tot=B.map(i=>({i,s:S(allL(),i)})),sumA=tot.reduce((t,x)=>t+x.s.A,0)||1;
 const cards=`<div class="bgrid">${tot.map((x,n)=>`<div class="bk" style="--bc:${BCOL[n%BCOL.length]}"><span>${esc(D.P[x.i].l)}</span><b>${Q(x.s.A)}</b><small><span class="cfh" style="${HS(x.s.ach)}">${P(x.s.ach)}</span> · Share ${P(x.s.A/sumA)}</small></div>`).join('')}</div>`;
 const cell=(L,i)=>{const s=S(L,i);return BRV==='a'?`<td class="acb">${Q(s.A)}</td>`:pc(s.ach)};
 const hd=first=>`<thead><tr>${first}${B.map((i,n)=>`<th class="gs" style="box-shadow:inset 0 3px 0 ${BCOL[n%BCOL.length]}">${esc(D.P[i].l)}</th>`).join('')}<th class="gs">Device<br>Total</th></tr></thead>`;
 const dev=L=>{const s=S(L,0);return BRV==='a'?`<td class="gs acb">${Q(s.A)}</td>`:pc(s.ach,'gs')};
 const tb=`<table>${hd('<th class="l">Region</th><th class="l">Area</th>')}<tbody>${RG.map(r=>AR.filter(a=>a.reg===r).map((a,n)=>`<tr${n===0?' class="g1"':''}><td class="l sm3">${r}</td><td class="l"><a href="#" class="lk goa" data-a="${esc(a.name)}" style="font-weight:600">${esc(a.name)}</a></td>${B.map(i=>cell(areaL(a.name),i)).join('')}${dev(areaL(a.name))}</tr>`).join('')+`<tr class="tt sh"><td class="l" colspan="2">${r}</td>${B.map(i=>cell(regL(r),i)).join('')}${dev(regL(r))}</tr>`).join('')}<tr class="tt"><td class="l" colspan="2">TOTAL</td>${B.map(i=>cell(allL(),i)).join('')}${dev(allL())}</tr></tbody></table>`;
 return sec('pBR1','Device by Brand',`${UL()} · Actual MTD · %ACH MTD vs Target by Brand`,cards)+
  sec('pBR2','Brand × Area',BRV==='a'?'Actual MTD':'%ACH MTD',`<div class="scroll">${tb}</div>`,seg('sgBRV',[['a','Actual MTD'],['p','%ACH MTD']],BRV))}
/* ---------- Shop ---------- */
function pgSH(){const f=SHF;let L=SH.filter(s=>f==='f34'?/^BMA (III|IV)/.test(s.area):f.startsWith('R:')?s.reg===f.slice(2):s.area===f);
 const rows=L.map(s=>({s,v:[0,1,2].map(k=>S([s.i],k))}));
 const c=SORT.pg==='sh'&&SORT.c?SORT.c:'';if(c){const [k,f2]=c.split('|');rows.sort((a,b)=>((b.v[+k][f2]??-1e9)-(a.v[+k][f2]??-1e9))*SORT.d)}else rows.sort((a,b)=>a.s.area.localeCompare(b.s.area)||b.v[0].A-a.v[0].A);

<style>
.v>.cam2{position:absolute;top:8px;right:8px;border:1px solid #C8C6C4;background:#fff;border-radius:4px;padding:2px 8px;font-size:13px;min-height:28px;z-index:3;opacity:.55;cursor:pointer}
.v:hover>.cam2,.v>.cam2:focus-visible{opacity:1}@media (hover:none){.v>.cam2{opacity:1}}
.v.hascam>.vt{padding-right:44px}
#camSheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:90;padding:12px}
#camSheet .bx{background:#fff;border-radius:8px;padding:14px;max-width:min(96vw,1000px);max-height:92vh;overflow:auto;width:100%;font:13px/1.4 "Segoe UI",Arial}
#camSheet img{max-width:100%;border:1px solid #E1DFDD;display:block;margin:8px auto}#camSheet .bt{display:flex;gap:8px;flex-wrap:wrap}
#camSheet button{border:1px solid #C8C6C4;background:#fff;border-radius:4px;padding:7px 14px;font:inherit;min-height:40px}#camSheet button.pr{background:#E6F2FF;border-color:#118DFF;color:#0B5CAD;font-weight:600}

/* ชื่อสาขาไม่ตัดบรรทัด (28 พ.ย.) */tbody td.l:first-child,tbody td.l:nth-child(2),tbody td.l:nth-child(3),td.wr2,td.l.wr2{white-space:nowrap!important;max-width:none!important}

/* TOP/BOTTOM แบบกะทัดรัด (28 พ.ย.) */.tq{padding:2px 0!important;font-size:12px!important;gap:4px!important}.tq .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}.tq .nm small{display:inline!important;margin-left:6px}.tq .vv{white-space:nowrap}.tq .vv small{display:inline!important;margin-left:5px}.tq .cf{padding:0 4px}.tbv .vt{margin-bottom:2px}

/* ปุ่มกล้องไม่ทับตาราง (28 พ.ย.) */.cam2{top:6px!important;right:8px!important;min-height:24px!important;height:24px;padding:0 7px!important;font-size:12px!important;line-height:22px}.hascam>.vt{padding-right:46px;min-height:26px;margin-bottom:6px!important}

/* แถบหัวข้อ/แท็บ ตรงแนวเนื้อหา (28 พ.ย.) */.tabs,.hdr{padding-left:max(10px,calc((100% - 1500px)/2 + 10px))!important;padding-right:max(10px,calc((100% - 1500px)/2 + 10px))!important}
</style>

<script>
{
const q=(s,r=document)=>r.querySelector(s),qa=(s,r=document)=>[...r.querySelectorAll(s)];
