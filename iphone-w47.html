/* การ์ด TOP 3 / BOTTOM 3 */
function tb3Card(title,sub,list,val,act,lab,ready){
  const L=list.filter(x=>val(x)!=null);const so=[...L].sort((a,b)=>val(b)-val(a)||act(b)-act(a));
  const top=so.slice(0,3),bot=so.slice(-3).reverse();
  const it=x=>`<div class="it"><span class="n" title="${esc(lab(x))}">${esc(lab(x))}</span><span class="p">${pct(val(x))} <small>(${Q(act(x))})</small></span></div>`;
  return `<div class="card${title==='iPhone N-'?' nm':''}"><h3>${title}<span>${sub}</span></h3>${ready&&so.length>=2?`<div class="two"><div class="lst top"><b class="hd">TOP 3</b>${top.map(it).join('')}</div><div class="lst bot"><b class="hd">BOTTOM 3</b>${bot.map(it).join('')}</div></div>`:'<div class="note">Waiting for Fri–Sun data</div>'}</div>`}


/* ตารางสรุปรายวัน: Target 3 วัน · ยอดแต่ละวัน + %ACH รายวัน · รวม + %ACH รวม */
function dayTable(title,sub,rows,days,have,tl,f=Q){
  const el=have.filter(Boolean).length;
  const head=`<thead><tr><th rowspan="2">GROUP</th><th rowspan="2" class="sep">${tl} 3 Days</th><th rowspan="2">${tl}/Day</th>${days.map((d,j)=>`<th colspan="2" class="sep">${dw(d)} ${dTH(d)}</th>`).join('')}<th colspan="4" class="sep">TOTAL ${days.length} Days</th></tr><tr>${days.map(()=>`<th class="sep">ACTUAL</th><th>%ACH</th>`).join('')}<th class="sep">ACTUAL</th><th>${tl} To Date</th><th>%ACH To Date</th><th>%ACH vs ${tl} 3 Days</th></tr></thead>`;
  const tr=(r,tag)=>{const A=r.d.reduce((a,b,j)=>a+(have[j]?b:0),0),TN=r.t*el,T3=r.t*days.length;
    return `<tr${tag?' class="'+tag+'"':''}><td class="l">${r.lab}</td><td class="r sep"><b>${f(T3)}</b></td><td class="r">${r.t<20?T1(r.t):f(r.t)}</td>${r.d.map((v,j)=>have[j]?`<td class="r sep${v===0?' z':''}"><b>${f(v)}</b></td><td class="c">${pct(r.t?v/r.t:null)}</td>`:`<td class="r sep wait">–</td><td class="c wait">–</td>`).join('')}<td class="r sep"><b>${el?f(A):'–'}</b></td><td class="r">${el?(TN<20?T1(TN):f(TN)):'–'}</td><td class="c">${el?pct(TN?A/TN:null):'–'}</td><td class="c">${el?pct(T3?A/T3:null):'–'}</td></tr>`};
  const body=rows.slice(0,-1).map(r=>tr(r)).join(''),last=rows[rows.length-1];
  return `<div class="title">${title}</div><div class="stt">${sub}</div><div class="scroll"><table class="xl">${head}<tbody>${body}</tbody><tfoot>${tr(last)}</tfoot></table></div>`}
