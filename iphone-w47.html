function dayTable(title,sub,rows,days,have,tl,f=Q){
  const el=have.filter(Boolean).length;
  const head=`<thead><tr><th rowspan="2">GROUP</th><th rowspan="2" class="sep">${tl} 3 Days</th><th rowspan="2">${tl}/Day</th>${days.map((d,j)=>`<th colspan="2" class="sep">${dw(d)} ${dTH(d)}</th>`).join('')}<th colspan="4" class="sep">TOTAL ${days.length} Days</th></tr><tr>${days.map(()=>`<th class="sep">ACTUAL</th><th>%ACH</th>`).join('')}<th class="sep">ACTUAL</th><th>${tl} To Date</th><th>%ACH To Date</th><th>%ACH vs ${tl} 3 Days</th></tr></thead>`;
  const tr=(r,tag)=>{const A=r.d.reduce((a,b,j)=>a+(have[j]?b:0),0),TN=r.t*el,T3=r.t*days.length;
    return `<tr${tag?' class="'+tag+'"':''}><td class="l">${r.lab}</td><td class="r sep"><b>${f(T3)}</b></td><td class="r">${r.t<20?T1(r.t):f(r.t)}</td>${r.d.map((v,j)=>have[j]?`<td class="r sep${v===0?' z':''}"><b>${f(v)}</b></td><td class="c ${ac0(r.t?v/r.t/dayTF(days[j]):null)}">${pct(r.t?v/r.t:null)}</td>`:`<td class="r sep wait">–</td><td class="c wait">–</td>`).join('')}<td class="r sep"><b>${el?f(A):'–'}</b></td><td class="r">${el?(TN<20?T1(TN):f(TN)):'–'}</td><td class="c ${el?ac(TN?A/TN:null):''}">${el?pct(TN?A/TN:null):'–'}</td><td class="c">${el?pct(T3?A/T3:null):'–'}</td></tr>`};
  const body=rows.slice(0,-1).map(r=>tr(r)).join(''),last=rows[rows.length-1];
  return `<div class="title">${title}</div><div class="stt">${sub}</div><div class="scroll"><table class="xl">${head}<tbody>${body}</tbody><tfoot>${tr(last)}</tfoot></table></div>`}

    lines.length=0;lines.push('iPhone Focus 3 Day (Fri–Sun) W47 — Shop Sales (Nationwide)');lines.push('Sent: '+nowStr());lines.push('Sales data to '+(D.last?dTH(D.last):'')+' · Fri–Sun '+dTH(D.days[0])+'–'+dTH(D.days[D.days.length-1])+(ANYP()?' · today in progress':''));
    const f=[SH.reg.join(', '),SH.area.join(', '),SH.type.join(', ')].filter(Boolean).join(' | ');if(f)lines.push('Filter: '+f);
    lines.push('');lines.push('Total iPhone '+Q(SAL.reduce((a,r)=>a+r.ta,0))+' · iPhone 18 '+Q(SAL.reduce((a,r)=>a+r.tp,0))+' · iPhone N- '+Q(SAL.reduce((a,r)=>a+r.tm,0))+' ('+SAL.length+' shops)');
    lines.push('');lines.push('Top 10 shops (Total iPhone)');SAL.slice(0,10).forEach((r,i)=>lines.push((i+1)+'. '+r.name+' ('+r.area+')  '+Q(r.ta)+'  [18: '+Q(r.tp)+' · N-: '+Q(r.tm)+']'));
    return lines.join('\n');
  }else if(TAB==='model'){
    const t=tabs[0],g=tGrid(t);const rows=[...t.tBodies[0].rows].map(r=>tCells(r));const iq=g.findIndex(l=>/TOTAL QTY/.test(l[l.length-1])),is=g.findIndex(l=>/SHARE/.test(l[l.length-1]));
    lines.push('');lines.push('Model Summary (QTY)');rows.forEach(c=>{if(+String(c[iq]).replace(/,/g,'')>0)lines.push(c[1]+'  '+c[iq]+' · '+(c[is]||'').replace(/\s+/g,' ')) });
    const tf=tCells(t.tFoot.rows[0]);lines.push('TOTAL  '+tf[iq])
    const MD=D.model;if(MD){lines.push('');lines.push('Top 3 / Bottom 3 Area by model (QTY)');
      MD.labels.forEach((lb,k)=>{const L=MD.rows.map(r=>({a:r.area,q:r.q[k].reduce((x,y)=>x+y,0)}));if(!L.some(x=>x.q>0))return;
        const hi=[...L].sort((x,y)=>y.q-x.q||x.a.localeCompare(y.a)).slice(0,3).filter(x=>x.q>0);
        const zeros=L.filter(x=>x.q===0).length;const lo=[...L].sort((x,y)=>x.q-y.q||x.a.localeCompare(y.a));
        const bot=zeros>3?'0 in '+zeros+' Areas':lo.slice(0,3).map(x=>x.a+' '+x.q).join(', ');
        lines.push('');lines.push(lb.replace('อื่นๆ (รุ่นเก่า)','Older models'));lines.push('  Top 3: '+hi.map((x,i)=>(i+1)+') '+x.a+' '+x.q).join('  '));lines.push('  Bottom 3: '+(zeros>3?bot:lo.slice(0,3).map((x,i)=>(i+1)+') '+x.a+' '+x.q).join('  ')))})}
  }else{
    $$('#pg .shot').forEach(sh=>{const ti=sh.querySelector('.title'),t=sh.querySelector('table.xl');if(!ti||!t||!t.tBodies[0]||/^Top Sales Staff/.test(ti.innerText.trim()))return;const g=tGrid(t);const col=g.findIndex(l=>/^(ACTUAL|TOTAL|QTY)$/.test(l[l.length-1])),pc=g.findIndex(l=>/%ACH To Date|%Commit 3 Days|%ACH/.test(l[l.length-1]));
      const lab=g.findIndex(l=>!/^(RANK|#)$/.test(l[l.length-1]));lines.push('');lines.push(ti.innerText.trim());
      [...t.tBodies[0].rows].slice(0,10).forEach((r,i)=>{const c=tCells(r);lines.push((i+1)+'. '+c[lab]+(col>=0?'  '+c[col]:'')+(pc>=0?' · '+c[pc]:''))})})
  }
  return lines.join('\n')}
function nowStr(){const d=new Date(),M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],z=n=>String(n).padStart(2,'0');return d.getDate()+' '+M[d.getMonth()]+' '+z(d.getHours())+':'+z(d.getMinutes())}

function lineFresh(){const ta=$('#lineTa');return ta.value.replace(/^Sent: .*$/m,'Sent: '+nowStr())}
async function lineCopy(){const tx=lineFresh();try{await navigator.clipboard.writeText(tx);lineMsg('Copied text — paste into LINE (Ctrl+V)')}catch(e){$('#lineTa').select();document.execCommand('copy');lineMsg('Copied text — paste into LINE (Ctrl+V)')}}
function lineOpen(){const tx=lineFresh();lineCopy();window.open('https://line.me/R/msg/text/?'+encodeURIComponent(tx),'_blank')}
function linePreview(){let m=$('#lineModal');if(!m){m=document.createElement('div');m.id='lineModal';m.innerHTML='<div class="lbox"><div class="lh">Preview — text for LINE <small>(editable · time is updated when you send)</small></div><textarea id="lineTa" spellcheck="false"></textarea><div class="lf"><button type="button" data-a="copy">Copy text</button><button type="button" data-a="open">Open LINE share</button><button type="button" data-a="close" class="g">Close</button></div></div>';document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.hidden=true};$$('button',m).forEach(b=>b.onclick=()=>{const k=b.dataset.a;if(k==='copy')lineCopy();else if(k==='open')lineOpen();else m.hidden=true})}
  $('#lineTa').value=lineText();m.hidden=false}
function addLineMenu(){const t=$('.tabs');if(!t||$('#lineMenu'))return;const w=document.createElement('span');w.id='lineMenu';w.innerHTML='<button type="button" id="lineBtn">LINE ▾</button><div class="lm" hidden><a data-a="txt">Text for LINE — preview &amp; send</a><a data-a="img">Copy page image</a></div>';t.appendChild(w);
  const m=$('.lm',w);$('#lineBtn').onclick=e=>{e.stopPropagation();m.hidden=!m.hidden};document.addEventListener('click',()=>{m.hidden=true});
  $$('a',m).forEach(a=>a.onclick=()=>{m.hidden=true;const k=a.dataset.a;if(k==='txt')linePreview();else snapPage()})}
function fitTables(on){$$('#pg table.al').forEach(t=>{t.style.zoom='1';if(!on)return;const av=t.parentElement.clientWidth,w=t.offsetWidth;if(w>av+1)t.style.zoom=Math.max(.55,av/w).toFixed(3)})}
window.addEventListener('resize',()=>{try{fitTables(1)}catch(e){}});
function alignCols(){
  const T=$$('#pg table.al');if(T.length<2){fitTables(1);return}
  fitTables(0);
  T.forEach(t=>{const r=t.tBodies[0]&&t.tBodies[0].rows[0];if(r)[...r.cells].forEach(c=>{c.style.width='';c.style.minWidth=''})});
  const W=[];T.forEach(t=>{const r=t.tBodies[0]&&t.tBodies[0].rows[0];if(r)[...r.cells].forEach((c,i)=>W[i]=Math.max(W[i]||0,c.getBoundingClientRect().width))});
  T.forEach(t=>{const r=t.tBodies[0]&&t.tBodies[0].rows[0];if(r)[...r.cells].forEach((c,i)=>{c.style.width=c.style.minWidth=Math.ceil(W[i])+'px'})});
  fitTables(1);
}
const ANYP=()=>(D.days||[]).some(d=>PART(d));
const tfN=()=>{const el=EL();return el?(EFFD()/el||1):1};
const dayTF=d=>{if(!PART(d))return 1;const b=String(D.built||''),hh=+b.slice(11,13)+(+b.slice(14,16))/60;return Math.min(1,Math.max(.15,(hh-10)/11))};
const acS=p=>p==null||!isFinite(p)?'':p>=1.1?'s0':p>=1?'s1':p>=.9?'s2':p>=.8?'s3':p>=.7?'s4':p>=.6?'s5':p>=.45?'s6':'s7';
const EFFD=()=>{let e=0;D.days.forEach((d,j)=>{if(D.have[j]){if(PART(d)){const b=String(D.built||''),hh=+b.slice(11,13)+(+b.slice(14,16))/60;e+=Math.min(1,Math.max(.15,(hh-10)/11))}else e+=1}});return e};
const PART=d=>{const b=String(D.built||'');return d===D.last&&b.slice(0,10)===d&&+b.slice(11,13)<21};
const _render0=render;render=function(){_render0.apply(this,arguments);try{alignCols()}catch(e){};try{addShots()}catch(e){console.error(e)}};
