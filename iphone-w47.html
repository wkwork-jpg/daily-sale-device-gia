<script>/* คลิกหัวคอลัมน์เพื่อเรียงมาก→น้อย / น้อย→มาก (TOTAL อยู่ท้ายเสมอ) */
(function(){
function grid(th){const rows=[...th.closest('thead').rows],G=[];rows.forEach((tr,ri)=>{G[ri]=G[ri]||[];let c=0;[...tr.cells].forEach(cell=>{while(G[ri][c])c++;const rs=cell.rowSpan||1,cs=cell.colSpan||1;for(let i=0;i<rs;i++){G[ri+i]=G[ri+i]||[];for(let j=0;j<cs;j++)G[ri+i][c+j]=cell}if(cell===th)th._ci=cs===1?c:-1;c+=cs})});return th._ci}
function val(td){if(!td)return null;let t=(td.textContent||'').replace(/[▲▼]/g,'').trim();if(t===''||t==='-'||t==='–'||t==='—')return null;const n=t.replace(/[,%฿\s]/g,'').replace(/^\+/,'');const m=n.match(/^-?\d+(\.\d+)?/);return m?parseFloat(m[0]):t.toLowerCase()}
document.addEventListener('mouseover',e=>{const th=e.target.closest&&e.target.closest('#pg table thead th');if(th&&!th.classList.contains('srt')&&th.colSpan===1)th.classList.add('srt')});
document.addEventListener('click',e=>{const th=e.target.closest&&e.target.closest('#pg table thead th');if(!th||e.target.closest('a,button,input,label'))return;const ci=grid(th);if(ci<0)return;const tb=th.closest('table').tBodies[0];if(!tb)return;
 const dir=th.dataset.sd==='d'?'a':'d';th.closest('thead').querySelectorAll('th').forEach(x=>{delete x.dataset.sd;const s=x.querySelector('.sar');if(s)s.remove()});th.dataset.sd=dir;const ar=document.createElement('span');ar.className='sar';ar.textContent=dir==='d'?'▼':'▲';th.appendChild(ar);
 const rs=[...tb.rows],tot=rs.filter(r=>/^\s*(TOTAL|รวม)/i.test(r.cells[0]&&r.cells[0].textContent||'')),body=rs.filter(r=>!tot.includes(r));
 body.sort((x,y)=>{const a=val(x.cells[ci]),b=val(y.cells[ci]);if(a===null&&b===null)return 0;if(a===null)return 1;if(b===null)return -1;const r=(typeof a==='number'&&typeof b==='number')?a-b:String(a).localeCompare(String(b),'th');return dir==='d'?-r:r});
 body.concat(tot).forEach(r=>tb.appendChild(r))});
})();</script>
</body></html>
