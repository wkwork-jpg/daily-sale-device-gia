<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone Focus 3 Day (Fri-Sun) W47</title>
<style>
:root{--hdr:#14305C;--hdr2:#1F4E8C;--hl:#3A66A5;--sep:#7FA3D1;--bg:#F3F6FB;--sel:#DCE9F8;--selB:#2F7BD6;--ink:#14305C;--mut:#6B6B70;--zeb:#FAFAFA;--hov:#F0F0F2}
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Thai',Tahoma,sans-serif;color:var(--ink);background:var(--bg);font-size:12.5px;font-variant-numeric:tabular-nums}
.rb{background:#fff;border-top:3px solid var(--hdr);box-shadow:0 1px 0 #E4E7EC;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.rb h1{margin:0;font-size:18px;color:var(--hdr);display:flex;align-items:center;gap:8px}.rb h1 .ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--sel)}
.rb .gap{flex:1}.flt{display:flex;gap:6px;flex-wrap:wrap}
.ms{position:relative}.ms-b{border:1px solid #D0D5DD;background:#fff;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;display:flex;gap:6px;align-items:center}
.ms-l{color:var(--mut);font-size:11px}.ms-v{font-weight:700}.ms-c{color:var(--mut)}
.ms-p{position:absolute;right:0;top:110%;background:#fff;border:1px solid #D0D5DD;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);width:240px;padding:8px;z-index:50}
.ms-q{width:100%;padding:6px 8px;border:1px solid #D0D5DD;border-radius:6px;font:inherit}.ms-a{display:flex;gap:12px;margin:6px 2px;font-size:12px}.ms-a a{color:var(--hdr2);cursor:pointer;text-decoration:underline}
.ms-o{max-height:240px;overflow:auto}.ms-o label{display:flex;gap:6px;padding:4px;cursor:pointer}.ms-o label:hover{background:var(--hov)}
.wrap{padding:14px 20px 30px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chips span{background:#fff;border:1px solid #E4E7EC;border-radius:14px;padding:4px 11px;color:var(--mut)}.chips b{color:var(--ink)}
.dchip.ok{border-color:#9FD0AE!important;background:#EEF8F1!important;color:#1E6B3A!important}.dchip.wait{border-style:dashed!important}
.kp{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:12px;margin-bottom:6px}
.card{background:#fff;border:1px solid #E4E7EC;border-top:3px solid var(--hdr);border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.card h3{margin:0;font-size:13px;color:var(--hdr)}.card .sub{color:var(--mut);font-size:11px;margin-top:2px}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}.card .v{font-size:26px;font-weight:700;color:var(--hdr)}.card .v small{font-size:13px;color:var(--mut);font-weight:400}
.badge{border-radius:14px;padding:3px 10px;font-weight:700}.badge.ok{background:#DCEFE2;color:#1E6B3A}.badge.mid{background:#FFF0C2;color:#7A5A00}.badge.low{background:#FBE1DE;color:#A8261E}.badge.na{background:#EEF0F3;color:#667085}
.bar{height:8px;background:#EEF0F3;border-radius:5px;margin-top:8px;position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--hdr2)}
.card .ln{display:flex;justify-content:space-between;color:var(--mut);font-size:11.5px;margin-top:6px}
.title{font-size:16px;font-weight:700;color:var(--hdr);border-left:4px solid var(--hdr);padding-left:9px;margin:20px 0 4px}.stt{color:var(--mut);padding-left:13px;margin-bottom:8px}
.xl{border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--hl);border-radius:10px;box-shadow:0 1px 3px rgba(16,24,40,.07);white-space:nowrap}
.xl th,.xl td{border-right:1px solid #E6E9EE;border-bottom:1px solid #E6E9EE;padding:6px 9px}
.xl thead th{background:var(--hdr);color:#fff;text-align:center;border-right-color:var(--hl);border-bottom-color:var(--hl)}
.xl thead tr:nth-child(2) th{background:var(--hdr2)}
.xl thead tr:first-child th:first-child{border-top-left-radius:9px}.xl thead tr:first-child th:last-child{border-top-right-radius:9px}
.xl tfoot td{background:var(--hdr);color:#fff;font-weight:700;border-right-color:var(--hl);border-bottom:0}
.xl tfoot tr:last-child td:first-child{border-bottom-left-radius:9px}.xl tfoot tr:last-child td:last-child{border-bottom-right-radius:9px}
.xl .sep{border-left:2px solid var(--sep)}.xl td.r{text-align:right}.xl td.c{text-align:center}.xl td.l{font-weight:700;color:var(--hdr)}
.xl tbody tr:nth-child(even) td{background:var(--zeb)}.xl tbody tr:hover td{background:var(--hov)}
.xl td.ok{background:#DCEFE2!important;color:#1E6B3A}.xl td.mid{background:#FFF0C2!important;color:#7A5A00}.xl td.low{background:#FBE1DE!important;color:#A8261E}
.xl td.z{color:#B3261E;font-weight:700}.xl td.wait{color:#A2A9B4!important;background:#F7F8FA!important}
.xl tfoot td.ok,.xl tfoot td.mid,.xl tfoot td.low,.xl tfoot td.wait{background:var(--hdr)!important;color:#fff!important}
.xl td.rkt1{background:#BFE3CB!important;color:#14532D;font-weight:700}.xl td.rkt{background:#E1F2E6!important;color:#1E6B3A;font-weight:700}.xl td.rkm{background:#FFF4CC!important;color:#7A5A00;font-weight:700}.xl td.rkb{background:#FBE1DE!important;color:#A8261E;font-weight:700}.xl td.rkb1{background:#F5C6C0!important;color:#8A1C14;font-weight:700}
.xl tfoot td.l{color:#fff}.cp{color:#1E6B3A;font-weight:700}.cn{color:#A8261E;font-weight:700}.xl tfoot .cp{color:#C9F1D3}.xl tfoot .cn{color:#FFD3CE}
.mine::after{content:''}
.note{color:var(--mut);font-size:11px;margin-top:8px}
.test{background:#FFF4CC;border:1px solid #E8C766;color:#7A5A00;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-weight:700}
.scroll{overflow:auto}
.tabs{display:flex;gap:6px;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid #E4E7EC;position:sticky;top:57px;z-index:19}
.tabs a{padding:8px 16px;border-radius:10px;border:1px solid #D6DCE4;background:#fff;font-weight:700;color:#344054;cursor:pointer}.tabs a.on{background:var(--sel);color:var(--hdr);border:2px solid var(--hdr);padding:7px 15px}
.tabs .gap{flex:1}.lb{font-size:11px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--selB);border-radius:8px;overflow:hidden}.seg button{border:0;border-right:1px solid var(--selB);background:#fff;padding:6px 12px;font:inherit;cursor:pointer;color:#344054}.seg button:last-child{border:0}.seg button.on{background:var(--sel);color:var(--hdr);font-weight:700}
.xl tr.rg td{background:#E9EEF5!important;font-weight:700;color:var(--hdr)}
.tb3{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:12px;margin:12px 0 4px}
.tb3 .card{padding:10px 12px}.tb3 h3{display:flex;justify-content:space-between}.tb3 h3 span{font-weight:400;color:var(--mut);font-size:11px}
.tb3 .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tb3 .lst b.hd{display:block;font-size:11.5px;margin-bottom:4px;padding:3px 8px;border-radius:6px}.tb3 .top b.hd{background:#DCEFE2;color:#1E6B3A}.tb3 .bot b.hd{background:#FBE1DE;color:#A8261E}
.tb3 .it{display:flex;justify-content:space-between;gap:6px;padding:4px 6px;border-bottom:1px dashed #EEF0F3;font-size:12px}.tb3 .it:last-child{border:0}
.tb3 .it .n{color:var(--hdr);font-weight:700}.tb3 .it .p{font-weight:700}.tb3 .top .p{color:#1E6B3A}.tb3 .bot .p{color:#A8261E}
.tb3 .it small{color:var(--mut);font-weight:400}
.xl thead th.nm{background:#2F6DB5!important}.xl thead tr:nth-child(2) th.nm{background:#4A86C7!important}.card.nm{border-top-color:#4A86C7}.card.nm .bar i{background:#4A86C7}.card.nm h3{color:#2F6DB5}
.bar i.ok{background:#4E9A6A!important}.bar i.mid{background:#D9A520!important}.bar i.low{background:#D0574C!important}
.kp4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:6px}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99}
#gate form{background:#fff;padding:26px 28px;border-radius:14px;border-top:4px solid var(--hdr);box-shadow:0 10px 30px rgba(16,24,40,.10);text-align:center;width:330px}
#gate input{width:100%;padding:9px;border:1px solid #D0D5DD;border-radius:8px;font:inherit;margin:14px 0 10px}#gate button{width:100%;padding:9px;border:1px solid var(--selB);background:var(--sel);color:var(--hdr);font-weight:700;border-radius:8px;cursor:pointer}
#gate .msg{color:var(--mut);font-size:12px;margin-top:8px;min-height:16px}

.shot{position:relative}

.shot:hover>.cam{opacity:1;pointer-events:auto}
.shot>.cam:hover{background:#E4E4E7}
.shooting .cam,.shooting #pgCam{display:none!important}
.shooting .scroll{overflow:visible!important}
#pgCam{border:1px solid #A1A1AA;background:#F4F4F5;color:#14305C;border-radius:8px;padding:4px 10px;font:600 12px Arial;cursor:pointer;margin-left:8px}

.xl td.pt{color:#14305C!important;font-weight:700;background:#F1F6FC!important}
.xl thead th.m18{background:#24508F!important}.xl thead tr:nth-child(2) th.m18{background:#3A6BAD!important}

.xl td.neu{background:#EAF1FA!important;color:#14305C!important}.badge.neu{background:#E3ECF8;color:#14305C}.bar i.neu{background:#4A86C7}
.xl thead th.sep.m18,.xl thead th.m18{background:#24508F!important}.xl thead tr:nth-child(2) th.m18{background:#3A6BAD!important}.xl td.sb{background:#EEF3FA;color:#14305C}
.xl tbody td.cm{background:transparent!important;color:#5B7BAA;font-weight:600}
.xl tbody td.act{background:transparent!important;color:#0F2A55;font-size:inherit!important;border-right:1px solid #D5DEEC}.xl tbody td.act b{font-weight:700;font-size:inherit}
.xl tbody td.ok{background:#DCEFE2!important;color:#1E6B3A;font-weight:700}.xl tbody td.mid{background:#FFF0C2!important;color:#7A5A00;font-weight:700}.xl tbody td.low{background:#FBE1DE!important;color:#A8261E;font-weight:700}
.xl tbody td.neu{background:#F3F7FC!important;color:#1F4E8C!important;font-weight:700}
.xl tfoot td.neu,.xl tfoot td.pt,.xl tfoot td.cm,.xl tfoot td.act{background:var(--hdr)!important;color:#fff!important}

.xl td.stk{color:#5B7BAA;font-weight:600}
.xl tfoot td.stk{color:#fff!important;font-weight:700}
.xl tfoot td{font-size:12px!important}.xl tfoot td b{font-size:12px!important;font-weight:700}
.proj{margin-top:8px;padding-top:7px;border-top:1px dashed #C9D6EA;font-size:12.5px;color:#14305C}.proj b{font-size:18px;margin:0 2px}.proj .badge{margin-left:4px}

function dayTable(title,sub,rows,days,have,tl,f=Q){

  const body=rows.slice(0,-1).map(r=>tr(r)).join(''),last=rows[rows.length-1];
  return `<div class="title">${title}</div><div class="stt">${sub}</div><div class="scroll"><table class="xl">${head}<tbody>${body}</tbody><tfoot>${tr(last)}</tfoot></table></div>`}

    $$('#pg .shot').forEach(sh=>{const ti=sh.querySelector('.title'),t=sh.querySelector('table.xl');if(!ti||!t||!t.tBodies[0])return;const g=tGrid(t);const col=g.findIndex(l=>/^(ACTUAL|TOTAL|QTY)$/.test(l[l.length-1])),pc=g.findIndex(l=>/%ACH To Date|%Commit 3 Days|%ACH/.test(l[l.length-1]));
      const lab=g.findIndex(l=>!/^(RANK|#)$/.test(l[l.length-1]));lines.push('');lines.push(ti.innerText.trim());
      [...t.tBodies[0].rows].slice(0,10).forEach((r,i)=>{const c=tCells(r);lines.push((i+1)+'. '+c[lab]+(col>=0?'  '+c[col]:'')+(pc>=0?' · '+c[pc]:''))})})
  }
  return lines.join('\n')}

  const m=$('.lm',w);$('#lineBtn').onclick=e=>{e.stopPropagation();m.hidden=!m.hidden};document.addEventListener('click',()=>{m.hidden=true});
  $$('a',m).forEach(a=>a.onclick=()=>{m.hidden=true;const k=a.dataset.a;if(k==='copy')lineCopy();else if(k==='open')lineOpen();else snap($('#pg'))})}
function fitTables(on){$$('#pg table.al').forEach(t=>{t.style.zoom='1';if(!on)return;const av=t.parentElement.clientWidth,w=t.offsetWidth;if(w>av+1)t.style.zoom=Math.max(.55,av/w).toFixed(3)})}
window.addEventListener('resize',()=>{try{fitTables(1)}catch(e){}});
function alignCols(){
  const T=$$('#pg table.al');if(T.length<2){fitTables(1);return}
  fitTables(0);
  T.forEach(t=>{const r=t.tBodies[0]&&t.tBodies[0].rows[0];if(r)[...r.cells].forEach(c=>{c.style.width='';c.style.minWidth=''})});
  const W=[];T.forEach(t=>{const r=t.tBodies[0]&&t.tBodies[0].rows[0];if(r)[...r.cells].forEach((c,i)=>W[i]=Math.max(W[i]||0,c.getBoundingClientRect().width))});
  T.forEach(t=>{const r=t.tBodies[0]&&t.tBodies[0].rows[0];if(r)[...r.cells].forEach((c,i)=>{c.style.width=c.style.minWidth=Math.ceil(W[i])+'px'})});
  fitTables(1);
}
