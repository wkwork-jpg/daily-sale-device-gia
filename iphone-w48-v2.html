function base(){const A=D.area,days=A.days.slice(7,14),have=A.have.slice(7,14),b=String(D.built||''),bd=b.slice(0,10),bh=+b.slice(11,13)+(+b.slice(14,16))/60;

 const f7=v=>Array(7).fill(v),sl=(a,i)=>(a||[]).slice(i,i+7).concat(f7(0)).slice(0,7);

 const shops=D.shops.map(s=>{const w18=sl(s.wk18,0),wt=sl(s.wk,0);return{name:s.name,area:s.area,areaFull:s.areaFull,type:s.type||'',a18:sl(s.p,0),am:sl(s.m,0),w18,wm:wt.map((v,j)=>v-w18[j]),c18:f7(s.tp||0),cm:f7(s.tm||0),n18:sl(s.pn,0),nm:sl(s.mn,0),s18:s.sp||0,sm:s.sm||0}});

function agg(L,name,extra){const z=Array(7).fill(0),o={name,...extra,n:L.length,a18:z,am:z,w18:z,wm:z,c18:z,cm:z,n18:z,nm:z,s18:0,sm:0};

 o.amt=amt.reduce((x,y,j)=>x+(H[j]?y:0),0);o.stk=g==='18'?e.s18:g==='m'?e.sm:e.s18+e.sm;
