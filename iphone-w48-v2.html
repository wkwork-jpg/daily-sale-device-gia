/* ---------- data model ---------- */
let BASE=null;
function base(){const A=D.area,days=A.days.slice(7,14),have=A.have.slice(7,14),b=String(D.built||''),bd=b.slice(0,10),bh=+b.slice(11,13)+(+b.slice(14,16))/60;
 const tf=days.map((d,j)=>!have[j]?0:(d===D.last&&bd===d&&bh<21?Math.min(1,Math.max(.15,(bh-10)/11)):1)),RD=Math.max(0,7-tf.reduce((x,y)=>x+y,0));
 const f7=v=>Array(7).fill(v),sl=(a,i)=>(a||[]).slice(i,i+7).concat(f7(0)).slice(0,7);
 const areas=A.rows.map(r=>{const T=(D.areaTg||{})[r.area]||[0,0];return{name:r.area,reg:r.reg,a18:sl(r.q18,7),am:sl(r.qm,7),w18:sl(r.q18,0),wm:sl(r.qm,0),c18:f7(T[0]),cm:f7(T[1]),n18:sl(r.n18,7),nm:sl(r.nm,7),s18:r.s18||0,sm:r.sm||0}});
 const shops=D.shops.map(s=>{const w18=sl(s.wk18,0),wt=sl(s.wk,0);return{name:s.name,area:s.area,areaFull:s.areaFull,type:s.type||'',a18:sl(s.p,0),am:sl(s.m,0),w18,wm:wt.map((v,j)=>v-w18[j]),c18:f7(s.tp||0),cm:f7(s.tm||0),n18:sl(s.pn,0),nm:sl(s.mn,0),s18:s.sp||0,sm:s.sm||0}});

const add=(x,y)=>x.map((v,j)=>v+y[j]);
function agg(L,name,extra){const z=Array(7).fill(0),o={name,...extra,n:L.length,a18:z,am:z,w18:z,wm:z,c18:z,cm:z,n18:z,nm:z,s18:0,sm:0};
 L.forEach(e=>{['a18','am','w18','wm','c18','cm','n18','nm'].forEach(k=>o[k]=add(o[k],e[k]));o.s18+=e.s18;o.sm+=e.sm});return o}
function st(e,g){const pick=k=>g==='18'?e[k+'18']:g==='m'?e[k+'m']:add(e[k+'18'],e[k+'m']),H=BASE.have;

function compute(){const f=F[PG];let rows,groups,gk;
