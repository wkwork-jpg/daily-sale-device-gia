  return `<td class="r sep">${Q(c.TW)}</td><td class="r" style="white-space:nowrap">${el?Q(c.today):'–'} <span style="color:#7A808A;font-weight:400">/ ${Q(c.tday)}</span></td><td class="r act"><b>${el?Q(c.A):'–'}</b></td><td class="c ${el?G3C(c.p):''}">${el?pct(c.p):'–'}</td><td class="r ${el&&c.gap<0?'gn':''}">${el?(Math.round(c.gap)>0?'+':'')+Q(Math.round(c.gap)||0):'–'}</td><td class="r ${c.st===0?'oos':''}">${Q(c.st)}</td><td class="r ${dcc}">${c.st<=0?'หมดแล้ว':c.dc==null?'ไม่มียอดขาย':Q(Math.ceil(c.dc))+' วัน'}</td>${rk===undefined?'':`<td class="c ${rk?rkC(rk,n):''}">${rk||'–'}</td>`}`}
function g3head(first,rank){const LJ=G3LJ(),dl=LJ>=0?DL(D.days[LJ]):'Today';
  const sub=r=>`<th class="sep">Target Week</th><th>${dl}<span class="h2l">ยอด / เป้าหมาย</span></th><th>ACTUAL WTD</th><th>%ACH To Date</th><th>GAP สะสม</th><th>Stock</th><th>Days to clear</th>${r?'<th>RANK</th>':''}`;
  return `<thead><tr>${first.map(f=>`<th rowspan="2">${f}</th>`).join('')}${G3().map(g=>`<th colspan="${rank?8:7}" class="sep">${esc(g)}</th>`).join('')}</tr><tr>${G3().map(()=>sub(rank)).join('')}</tr></thead>`}
function g3rank(L){G3().forEach((g,i)=>{const S=[...L].map(r=>({r,p:g3calc(r.g[i]).p})).filter(x=>x.p!=null&&D.have.some(Boolean)).sort((a,b)=>b.p-a.p);L.forEach(r=>r['rk'+i]=0);S.forEach((x,k)=>x.r['rk'+i]=k+1)})}
function g3cards(L){const T=g3sum(L);return `<div class="kp">${G3().map((g,i)=>{const c=g3calc(T[i]),w=c.TW>0?Math.min(100,c.A/c.TW*100):0;
  return `<div class="card"><h3>${esc(g)}</h3><div class="sub">Target Week ${Q(c.TW)} · Target to date ${Q(c.TD)}</div><div class="row"><div class="v">${Q(c.A)} <small>/ ${Q(c.TW)} QTY</small></div><span class="badge">${D.have.some(Boolean)?pct(c.p):'No data yet'}</span></div><div class="bar"><i style="width:${w}%"></i></div><div class="ln"><span>GAP สะสม <b>${(Math.round(c.gap)>0?'+':'')+Q(Math.round(c.gap)||0)}</b></span><span>Stock <b>${Q(c.st)}</b> · ${c.st<=0?'หมดแล้ว':c.dc==null?'ไม่มียอดขาย':'Days to clear <b>'+Q(Math.ceil(c.dc))+' วัน</b>'}</span></div></div>`}).join('')}</div>`}
const G3NOTE=()=>`<div class="note">แยก 3 กลุ่มรุ่น ไม่รวมยอดกัน: Tecno POP20 4/64 · Samsung A08 (4/64 + 4/128) · realme Note 80 4/64 · Target = Target by Brand เดือนของแต่ละรุ่น รายสาขา ÷ จำนวนวันของเดือน · Target to date = เป้าหมายรายวัน × วันที่มียอด · %ACH To Date = ACTUAL ÷ Target to date · Days to clear = Stock ÷ ยอดขายเฉลี่ยต่อวัน · สี %ACH: ≥100% เขียว · 90–99% ขาว · 80–89% เหลือง · ต่ำกว่า 80% แดง</div>`;
function g3shopRows(){return D.shops.map(s=>({code:s[0],name:s[1],area:s[2],type:s[3],reg:D.regs[s[2]]||'',g:g3row(s)}))}
var NLG3=0;
function NLC(p){return p==null||!isFinite(p)?'#CBD5E1':p>=1?'#2E9E5B':p>=.9?'#94A3B8':p>=.8?'#E0A526':'#D9534F'}
function NLDC(d){return d==null?'#D9534F':d>=30?'#D9534F':d>=20?'#E0A526':'#94A3B8'}
function NLRING(p,lab){const r=42,C=2*Math.PI*r,d=p==null?0:C*Math.min(p,1);return `<svg width="104" height="104" viewBox="0 0 104 104" style="flex:0 0 auto"><circle cx="52" cy="52" r="${r}" fill="none" stroke="#E6EBF1" stroke-width="10"/><circle cx="52" cy="52" r="${r}" fill="none" stroke="${NLC(p)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${d.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 52 52)"/><text x="52" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="var(--hdr)" font-family="Arial">${p==null?'–':(p*100).toFixed(1)+'%'}</text><text x="52" y="67" text-anchor="middle" font-size="10" fill="#64748B" font-family="Arial">${lab}</text></svg>`}
function NL3(S,ar){const G=G3(),T=g3sum(S),el=D.have.some(Boolean),LJ=G3LJ(),n=ND();
  const dct=c=>c.st<=0?'หมดแล้ว':c.dc==null?'ไม่มียอดขาย':Q(Math.ceil(c.dc))+' วัน';
  let h=`<div class="nl-days"><span>สัปดาห์ ${dTH(D.days[0])}–${dTH(D.days[n-1])}</span>${D.days.map(d=>`<i class="${D.have[D.days.indexOf(d)]?'d':''}"></i>`).join('')}<span>มีข้อมูล ${D.have.filter(Boolean).length} จาก ${n} วัน</span><span class="nl-tg">Target = Target by Brand ÷ จำนวนวันของเดือน</span></div>`;
  h+=`<div class="nl-g3">${G.map((g,i)=>{const c=g3calc(T[i]);return `<div class="nl-t">${NLRING(el?c.p:null,'ACH ถึงวันนี้')}<div><h3>${esc(g)}</h3><div class="nl-big">${Q(c.A)} <small>/ ${Q(c.TW)}</small></div><div class="nl-kv"><div>Stock<b>${Q(c.st)}</b></div><div>Days to clear<b style="color:${c.st<=0?'#1E293B':NLDC(c.dc)}">${dct(c)}</b></div><div>GAP สะสม<b class="${el&&c.gap<0?'neg':''}">${el?(Math.round(c.gap)>0?'+':'')+Q(Math.round(c.gap)||0):'–'}</b></div></div></div></div>`}).join('')}</div>`;
  const gi=Math.min(NLG3,G.length-1),L=ar.map(a=>({lab:a.lab,c:g3calc(a.g[gi])})).map(x=>({...x,v:x.c.st<=0?0:x.c.dc==null?Infinity:x.c.dc})).sort((a,b)=>b.v-a.v);
  const fin=L.filter(x=>isFinite(x.v)).map(x=>x.v),mx=Math.max(30,...fin);
  h+=`<div class="nl-panel"><div class="nl-ph"><h2>Days to clear ราย Area — ${esc(G[gi])} · ยาวสุดอยู่บน (ต้องเร่งระบาย Stock)</h2><div class="nl-sw">${G.map((g,i)=>`<a class="${i===gi?'on':''}" onclick="NLG3=${i};render()">${esc(g)}</a>`).join('')}</div></div><div class="nl-bars">${L.map(x=>{const inf=!isFinite(x.v);return `<div class="r"><span class="n">${esc(x.lab)}</span><div class="tr"><i style="width:${inf?100:Math.min(x.v/mx*100,100).toFixed(1)}%;background:${x.c.st<=0?'#CBD5E1':inf?'repeating-linear-gradient(45deg,#F2B8B5 0 6px,#fff 6px 10px)':NLDC(x.v)}"></i></div><span class="v" style="color:${x.c.st<=0?'#64748B':NLDC(inf?null:x.v)}">${dct(x.c)}</span><span class="nl-sk">Stock ${Q(x.c.st)}</span></div>`}).join('')}</div><div class="nl-lg">Days to clear = Stock ÷ ยอดขายเฉลี่ยต่อวัน · แดง ≥30 วัน · เหลือง 20–29 วัน · ลายแดง = มี Stock แต่ยังไม่มียอดขาย</div></div>`;
  return h}
function renderArea3(){const S=g3shopRows(),ar=D.areas.map(a=>({lab:a,reg:D.regs[a]||'',g:g3sum(S.filter(s=>s.area===a))}));g3rank(ar);
  let h=NL3(S,ar);
  const regs=['BMA','UPC I','UPC II'].map(r=>({lab:r+' ('+ar.filter(a=>a.reg===r).length+' Area)',g:g3sum(S.filter(s=>s.reg===r))}));
  h+=`<div class="title">Region Summary — 3 model groups (QTY)</div><div class="stt">ยอดแยกกลุ่มรุ่น ไม่รวมกัน</div><div class="scroll"><table class="xl">${g3head(['REGION'],false)}<tbody>${regs.map(o=>`<tr><td class="l b">${esc(o.lab)}</td>${o.g.map(x=>g3cells(x)).join('')}</tr>`).join('')}</tbody><tfoot><tr><td class="l">TOTAL 15 Area</td>${g3sum(S).map(x=>g3cells(x)).join('')}</tr></tfoot></table></div>`;
  h+=`<div class="title">15 Area — 3 model groups (QTY)</div><div class="stt">RANK = %ACH To Date ranking within each model group · sorted by Region</div><div class="scroll"><table class="xl">${g3head(['AREA'],true)}<tbody>${ar.map(o=>`<tr><td class="l b">${esc(o.lab)}</td>${o.g.map((x,i)=>g3cells(x,o['rk'+i],ar.length)).join('')}</tr>`).join('')}</tbody><tfoot><tr><td class="l">TOTAL 15 Area</td>${g3sum(S).map(x=>g3cells(x,0,0)).join('')}</tr></tfoot></table></div>`;
  return h+G3NOTE()}
function g3shopTable(title,L){g3rank(L);const T=g3sum(L);L.sort((a,b)=>(a.rk0||999)-(b.rk0||999)||a.name.localeCompare(b.name));
  return `<div class="title">${title}</div><div class="stt">${L.length} shops · RANK = %ACH To Date ranking within each model group · sorted by Tecno POP20 rank</div><div class="scroll"><table class="xl">${g3head(['SHOP','Area','Type Shop'],true)}<tbody>${L.map(o=>`<tr><td class="l b">${esc(o.name)}</td><td class="l">${esc(o.area)}</td><td class="l">${esc(o.type)}</td>${o.g.map((x,i)=>g3cells(x,o['rk'+i],L.length)).join('')}</tr>`).join('')}</tbody><tfoot><tr><td class="l">TOTAL (${L.length} shops)</td><td></td><td></td>${T.map(x=>g3cells(x,0,0)).join('')}</tr></tfoot></table></div>`}
function g3f(L){const q=(SQ||'').toLowerCase();return L.filter(s=>(!F.reg.length||F.reg.includes(s.reg))&&(!F.area.length||F.area.includes(s.area))&&(!F.type.length||F.type.includes(s.type))&&(!q||(s.name+' '+s.code).toLowerCase().includes(q)))}
function renderBma3(){const S=g3f(g3shopRows()).filter(s=>/^BMA (III|IV)/.test(s.area));let h=g3cards(S);['BMA III','BMA IV'].forEach(a=>{const L=S.filter(s=>s.area.startsWith(a+' '));if(L.length)h+=g3shopTable(`Shop — ${a} — 3 model groups (QTY)`,L)});return h+G3NOTE()}
function renderAll3(){const S=g3f(g3shopRows());return g3cards(S)+g3shopTable('Shop (Nationwide) — 3 model groups (QTY)',S)+G3NOTE()}

function render(){const n=ND();
  $('#stat').innerHTML=`Sales data to <b>${D.last?dTH(D.last):'–'}</b>${D.last&&dayTF(D.last)<1?' (in progress)':''}<br>Updated ${esc(builtStr(D.built))} · Stock as of ${esc(builtStr(D.stockAsof))}`;
  let h=D.test?'<div class="chips"><span style="border-color:#E0B000;color:#7A5A00"><b>Test file</b> — other dates</span></div>':'';

  const pg=$('#pg');pg.classList.toggle('bmac',TAB==='bma'||TAB==='all'||TAB==='staff');pg.innerHTML=h;try{document.querySelectorAll('#pg .kp').forEach(k=>k.classList.add('k'+k.children.length))}catch(e){};try{document.querySelectorAll('#pg .kp,#pg .kp4').forEach(k=>{const C=[...k.children].filter(c=>c.classList.contains('card'));let h=k.classList.contains('k9')?C[7]:C.find(c=>{const t=(c.querySelector('h3')||{}).textContent||'';return /^Total/i.test(t.trim())});if(h)h.classList.add('hero')})}catch(e){};addShots();try{addB34()}catch(e){console.error(e)}alignCols();fitTables()}
/* ตาราง BMA III กับ BMA IV ใช้ความกว้างคอลัมน์ชุดเดียวกัน ให้คอลัมน์ตรงกัน */
function alignCols(){const T=$$('#pg.bmac table.xl');T.forEach(t=>{t.style.zoom='';t.style.tableLayout='';t.style.width='';const g=t.querySelector('colgroup.al');if(g)g.remove()});if(T.length<2)return;const W=[];T.forEach(t=>{const r=t.tBodies[0]&&t.tBodies[0].rows[0];if(r)[...r.cells].forEach((c,i)=>W[i]=Math.max(W[i]||0,Math.ceil(c.getBoundingClientRect().width)))});const sum=W.reduce((x,y)=>x+y,0);T.forEach(t=>{const r=t.tBodies[0]&&t.tBodies[0].rows[0];if(!r||r.cells.length!==W.length)return;const g=document.createElement('colgroup');g.className='al';g.innerHTML=W.map(w=>`<col style="width:${w}px">`).join('');t.insertBefore(g,t.firstChild);t.style.tableLayout='fixed';t.style.width=sum+'px'})}
/* ย่อตารางให้พอดีจอ ไม่ต้องเลื่อนแนวนอน (ไม่ใช้กับตาราง Raw data) */
function fitTables(){$$('#pg .scroll').forEach(w=>{if(w.style.maxHeight)return;const t=w.querySelector('table');if(!t)return;t.style.zoom='';const cw=w.clientWidth,sw=t.scrollWidth;if(sw>cw+1)t.style.zoom=Math.max(.5,cw/sw).toFixed(3)})}
addEventListener('resize',()=>{clearTimeout(window.__ft);window.__ft=setTimeout(()=>D&&fitTables(),150)});

/* [22 Nov] ปุ่มถ่ายรูป Shop Ranking BMA III + BMA IV รวมในรูปเดียว */
function addB34(){const pg=$('#pg');if(!pg||pg.querySelector('.b34'))return;const S=[...pg.querySelectorAll('.shot')].filter(x=>/^Shop Ranking — BMA (III|IV)/.test(((x.querySelector('.title')||{}).textContent||'').trim()));if(S.length<2)return;const b=document.createElement('button');b.className='b34';b.type='button';b.textContent='📷 ถ่ายรูป BMA III + BMA IV (รูปเดียว)';b.title='คัดลอกรูป 2 ตารางรวมกันไปวาง LINE';S[0].before(b);b.onclick=async e=>{e.stopPropagation();const w=document.createElement('div');w.style.background='#fff';S[0].before(w);S.forEach(x=>w.appendChild(x));const hd=null;try{await snap(w,true)}finally{if(typeof hd!=='undefined'&&hd)hd.remove();S.forEach(x=>w.before(x));w.remove()}}}
/* [22 Nov] มือถือ / แท็บเล็ต: ถ่ายรูปแล้วส่ง LINE ผ่านเมนูแชร์ของเครื่อง (คอมยังคัดลอกไปวางเหมือนเดิม) */
const MOB=()=>{try{return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)||matchMedia('(hover:none)').matches}catch(e){return false}};
const MOBPR=(w,h,pr)=>MOB()?Math.max(.8,Math.min(pr,Math.sqrt(15e6/Math.max(1,w*h)))):pr;
const SHT=el=>{if(!el)return'';const ts=el.querySelectorAll('.title'),h=el.querySelector('.shT'),t=ts.length===1?ts[0]:(h||ts[0]);return t?t.textContent.replace(/\s+/g,' ').trim():''};
function shotSheet(blob,note,ttl){const old=document.getElementById('shSheet');if(old)old.remove();ttl=ttl||'';const upd='Update '+builtStr(D.built),stx=(ttl?ttl+'\n':'')+upd;const u=URL.createObjectURL(blob),nm=((ttl||'Report').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,'_').slice(0,60))+'_'+String(D.built||'').replace(/[^0-9]/g,'').slice(0,12)+'.png',file=new File([blob],nm,{type:'image/png'});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));const d=document.createElement('div');d.id='shSheet';
  d.innerHTML=`<div class="bx"><b>รูปพร้อมส่งแล้ว</b><div style="font-size:12px;color:#64748B;white-space:pre-line">${esc(stx)}</div><div class="im"><img src="${u}" alt=""></div><div class="bt">${canShare?'<button class="ln" id="shShare">ส่งไป LINE / แชร์รูป</button>':''}<button id="shCopy">คัดลอกรูป</button><a href="${u}" download="${nm}">บันทึกรูป</a><button id="shClose" style="grid-column:1/-1;background:#fff">ปิด</button></div><div class="hn">${note?note+'<br>':''}${canShare?'กด “ส่งไป LINE / แชร์รูป” แล้วเลือก LINE → เลือกห้องแชท':'หรือกดค้างที่รูป → เลือก คัดลอก/บันทึกรูป แล้วไปวางใน LINE'}</div></div>`;
  document.body.appendChild(d);const close=()=>{d.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)};
  d.onclick=e=>{if(e.target===d)close()};d.querySelector('#shClose').onclick=close;
  const sb=d.querySelector('#shShare');if(sb)sb.onclick=async()=>{try{await navigator.share({files:[file],text:stx})}catch(e){}};
  d.querySelector('#shCopy').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);shotMsg('คัดลอกรูปแล้ว — ไปวางใน LINE ได้เลย')}catch(e){shotMsg('เครื่องนี้คัดลอกรูปไม่ได้ — กดค้างที่รูปแล้วเลือกคัดลอก/บันทึก',4000)}}}
/* ===== 📷 คัดลอกรูปไปวาง LINE ===== */
function addShots(){const pg=$('#pg');
  $$('.title',pg).forEach(t=>{const w=document.createElement('div');w.className='shot';t.before(w);let n=t;const L=[];while(n){L.push(n);const nx=n.nextElementSibling;if(n.classList.contains('scroll')||!nx||nx.classList.contains('title')||nx.classList.contains('kp'))break;n=nx}L.forEach(x=>w.appendChild(x))});
  $$('.kp,.nl-g3,.nl-panel',pg).forEach(k=>{if(k.parentElement.classList.contains('shot'))return;const w=document.createElement('div');w.className='shot';k.before(w);w.appendChild(k)});
  $$('.shot',pg).forEach(d=>{const b=document.createElement('button');b.className='cam';b.type='button';b.textContent='📷';b.title='คัดลอกรูปส่วนนี้ไปวาง LINE';b.onclick=e=>{e.stopPropagation();snap(d,true)};d.appendChild(b)})}
function shotMsg(t,ms=2200){let m=$('#shotMsg');if(!m){m=document.createElement('div');m.id='shotMsg';document.body.appendChild(m)}m.textContent=t;m.style.display='block';clearTimeout(m._t);if(ms)m._t=setTimeout(()=>m.style.display='none',ms)}
const TABN=()=>(($('#tabs a.on')||{}).textContent||'');
function shotHead(){const h=document.createElement('div');h.className='shHead';h.innerHTML=`<div class="shT">Focus Tecno / A08 / Note 80 — ${esc(TABN())}</div><div class="shS">Campaign ${esc(D.days.map(DL).join(' – '))} · Sales data to ${D.last?dTH(D.last):'–'} · Updated ${esc(builtStr(D.built))} · Stock as of ${esc(builtStr(D.stockAsof))}</div>`;return h}
async function snap(el,head){shotMsg('กำลังสร้างรูป...',0);document.body.classList.add('shooting');
  const tbs=[...el.querySelectorAll('table')];tbs.forEach(t=>t.style.zoom='');const scs=[...el.querySelectorAll('.scroll')].map(x=>[x,x.style.overflow,x.style.maxHeight]);scs.forEach(([x])=>{x.style.overflow='visible'});
  const hd=head?shotHead():null;if(hd)el.insertBefore(hd,el.firstChild);
  const w=Math.ceil(Math.max(el.offsetWidth,...tbs.map(t=>t.scrollWidth+2)));const ow=el.style.width,op=el.style.padding,obg=el.style.background;el.style.width=(w+24)+'px';el.style.padding='8px 10px 20px';el.style.background='#FFFFFF';let blob;
  try{const pr=MOBPR(w,el.scrollHeight,Math.max(1.5,Math.min(2.5,15500/Math.max(el.scrollHeight,w))));blob=await htmlToImage.toBlob(el,{pixelRatio:pr,backgroundColor:'#FFFFFF',width:el.offsetWidth,height:Math.ceil(el.getBoundingClientRect().height)+4,filter:n=>!(n.classList&&(n.classList.contains('cam')||n.classList.contains('pgcam')))})}
  catch(e){shotMsg('สร้างรูปไม่สำเร็จ')}
  finally{if(hd)hd.remove();scs.forEach(([x,a,b])=>{x.style.overflow=a;x.style.maxHeight=b});el.style.width=ow;el.style.padding=op;el.style.background=obg;document.body.classList.remove('shooting');fitTables()}
