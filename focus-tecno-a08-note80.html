/* ---------- [24 พ.ย. 2026] แท็บ Suplife All Products: ขายอะไรได้บ้าง รวมกี่ชิ้นต่อวัน ---------- */
function monData(){const M=D.mon;if(!M)return null;const n=ND(),q=SQ.toLowerCase();
  const S=M.shops.map((r,k)=>({k,code:r[0],name:r[1],area:r[2],type:r[3],reg:D.regs[r[2]]||''}));
  const okS=S.map(s=>(!F.reg.length||F.reg.includes(s.reg))&&(!F.area.length||F.area.includes(s.area))&&(!F.type.length||F.type.includes(s.type))&&(!q||(s.name+' '+s.code).toLowerCase().includes(q)));
  const okI=M.items.map((x,i)=>!F.cat.length||F.cat.includes(M.cat[i]));
  const sd=S.map(()=>({d:Array(n).fill(0),c:{},stk:0})),idd=M.items.map(()=>({d:Array(n).fill(0),stk:0}));
  M.f.forEach(([s,i,v])=>{if(!okS[s]||!okI[i])return;v.forEach((x,j)=>{sd[s].d[j]+=x;idd[i].d[j]+=x;sd[s].c[M.cat[i]]=(sd[s].c[M.cat[i]]||0)+x})});
  M.stk.forEach(([s,i,x])=>{if(!okS[s]||!okI[i])return;sd[s].stk+=x;idd[i].stk+=x});
  const cats=M.cats.filter(c=>M.cat.some((x,i)=>x===c&&okI[i]));
  return{M,n,S,okS,okI,sd,idd,cats}}
const MSUM=a=>a.reduce((x,y)=>x+y,0);
const CLRT=(t,st)=>{const el=D.have.filter(Boolean).length,st_=t+st>0?t/(t+st):null,avg=el?t/el:0,dc=st<=0?0:avg>0?st/avg:null;const sc=st_==null?'':st_>=.5?'g':st_<.2?'rd':'';const dcc=dc==null?'rd':dc>30?'rd':dc<=7?'g':'';return `<td class="r ${sc}">${pct(st_)}</td><td class="r ${dcc}">${st<=0?'หมดแล้ว':dc==null?'ไม่มียอดขาย':Q(Math.ceil(dc))+' วัน'}</td>`};
const MHEAT=(v,mx)=>v>0&&mx>0?` style="background:rgba(51,65,85,${(0.05+0.17*v/mx).toFixed(3)})"`:'';
function monDayHead(){return D.days.map(d=>`<th>${DL(d)}</th>`).join('')}
function monDayCells(d,mx,bold){return D.days.map((x,j)=>D.have[j]?`<td class="r"${MHEAT(d[j],mx)}>${bold?'<b>':''}${Q(d[j])}${bold?'</b>':''}</td>`:'<td class="r" style="color:#A0A8B4">–</td>').join('')}
function renderMon(){const X=monData();if(!X)return '<div class="note">No data</div>';const {M,S,okS,sd,idd,cats}=X,n=X.n;let h='';

  /* 2) รายสินค้า × รายวัน */
  const it=M.items.map((nm,i)=>({nm,c:M.cat[i],d:idd[i].d,t:MSUM(idd[i].d),st:idd[i].stk})).filter((o,i)=>X.okI[i]&&(o.t||o.st)).sort((a,b)=>cats.indexOf(a.c)-cats.indexOf(b.c)||b.t-a.t);
  const mxi=Math.max(0,...it.flatMap(o=>o.d));
  h+=`<div class="title">By Model — Daily (QTY)</div><div class="stt">${it.length} products with sales or stock · grouped by category, best seller first</div><div class="scroll"><table class="xl"><thead><tr><th class="l">Model Group</th><th class="l">Product</th>${monDayHead()}<th class="sep">Total</th><th class="sep">Stock</th><th>Sell-through</th><th>Days to clear</th></tr></thead><tbody>${it.map(o=>`<tr><td class="l">${esc(o.c)}</td><td class="l b">${esc(o.nm)}</td>${monDayCells(o.d,mxi)}<td class="r sep b${o.t?'':' z0'}">${Q(o.t)}</td><td class="r sep">${Q(o.st)}</td>${CLRT(o.t,o.st)}</tr>`).join('')}</tbody><tfoot><tr><td class="l">TOTAL</td><td></td>${D.days.map((x,j)=>`<td class="r">${D.have[j]?Q(tot[j]):'–'}</td>`).join('')}<td class="r sep">${Q(TT)}</td><td class="r sep">${Q(MSUM(it.map(o=>o.st)))}</td>${CLRT(TT,MSUM(it.map(o=>o.st)))}</tr></tfoot></table></div>`;
  /* 3) 15 Area × รายวัน */
  const grp=(L,key)=>{const o={d:Array(n).fill(0),c:{},stk:0,cnt:0};L.forEach(k=>{sd[k].d.forEach((v,j)=>o.d[j]+=v);for(const c in sd[k].c)o.c[c]=(o.c[c]||0)+sd[k].c[c];o.stk+=sd[k].stk;o.cnt++});o.t=MSUM(o.d);return o};

  const ta=grp(ks),mxa=Math.max(0,...ar.flatMap(o=>o.d));
  const catC=o=>cats.map(c=>`<td class="r">${Q(o.c[c]||0)}</td>`).join('');
  h+=`<div class="title">15 Area — Daily Sales by Model Group (QTY)</div><div class="stt">Sorted by total, high to low · category columns = total of the period</div><div class="scroll"><table class="xl"><thead><tr><th>RANK</th><th class="l">Area</th><th>Shops</th>${monDayHead()}<th class="sep">Total</th>${cats.map(c=>`<th>${esc(c)}</th>`).join('')}<th class="sep">Stock</th><th>Sell-through</th><th>Days to clear</th></tr></thead><tbody>${ar.map((o,i)=>`<tr><td class="c ${rkC(i+1,ar.length)}">${i+1}</td><td class="l b">${esc(o.lab)}</td><td class="c">${o.cnt}</td>${monDayCells(o.d,mxa)}<td class="r sep b${o.t?'':' z0'}">${Q(o.t)}</td>${catC(o)}<td class="r sep">${Q(o.stk)}</td>${CLRT(o.t,o.stk)}</tr>`).join('')}</tbody><tfoot><tr><td></td><td class="l">TOTAL ${ar.length} Area</td><td class="c">${ta.cnt}</td>${D.days.map((x,j)=>`<td class="r">${D.have[j]?Q(ta.d[j]):'–'}</td>`).join('')}<td class="r sep">${Q(ta.t)}</td>${catC(ta)}<td class="r sep">${Q(ta.stk)}</td>${CLRT(ta.t,ta.stk)}</tr></tfoot></table></div>`;

   h+=`<div class="title">Shop — ${a} — Daily Sales by Model Group (QTY)</div><div class="stt">${L.length} shops · sorted by total, high to low · 0 = no sale</div><div class="scroll"><table class="xl"><thead><tr><th>RANK</th><th class="l">Shop</th><th class="l">Area</th><th class="l">Type Shop</th>${monDayHead()}<th class="sep">Total</th>${cats.map(c=>`<th>${esc(c)}</th>`).join('')}<th class="sep">Stock</th><th>Sell-through</th><th>Days to clear</th></tr></thead><tbody>${L.map((o,i)=>`<tr><td class="c ${rkC(i+1,L.length)}">${i+1}</td><td class="l b">${esc(o.name)}</td><td class="l">${esc(o.area)}</td><td class="l">${esc(o.type)}</td>${monDayCells(o.d,mx)}<td class="r sep b${o.t?'':' z0'}">${Q(o.t)}</td>${catC(o)}<td class="r sep">${Q(o.stk)}</td>${CLRT(o.t,o.stk)}</tr>`).join('')}</tbody><tfoot><tr><td></td><td class="l">TOTAL ${a} (${L.length} shops)</td><td></td><td></td>${D.days.map((x,j)=>`<td class="r">${D.have[j]?Q(t.d[j]):'–'}</td>`).join('')}<td class="r sep">${Q(t.t)}</td>${catC(t)}<td class="r sep">${Q(t.stk)}</td>${CLRT(t.t,t.stk)}</tr></tfoot></table></div>`});

/* ---------- [24 พ.ย. 2026] แยกยอด 3 กลุ่มรุ่น (Tecno POP20 | Samsung A08 | realme Note 80) — ไม่มียอดรวม ---------- */
const G3=()=>D.gnames||['Tecno POP20','Samsung A08','realme Note 80'];
function g3row(s){const G=G3(),n=ND(),gi=G.map(g=>D.skus.map((x,k)=>k).filter(k=>D.groups[k]===g));
  return G.map((g,i)=>{const d=Array(n).fill(0);(s[7]||[]).forEach((dd,j)=>gi[i].forEach(k=>d[j]+=dd[k]||0));const tg=(s[9]&&s[9][i])||Array(n).fill(0);const stk=gi[i].reduce((a,k)=>a+(s[6][k]||0),0);return{d,tg,stk}})}
function g3sum(L){const n=ND();return G3().map((g,i)=>{const o={d:Array(n).fill(0),tg:Array(n).fill(0),stk:0};L.forEach(r=>{const x=r.g[i];x.d.forEach((v,j)=>o.d[j]+=v);x.tg.forEach((v,j)=>o.tg[j]+=v);o.stk+=x.stk});return o})}
const G3LJ=()=>D.have.lastIndexOf(true);
function g3calc(x){const n=ND(),LJ=G3LJ();const A=x.d.reduce((a,v,j)=>a+(D.have[j]?v:0),0),TW=x.tg.reduce((a,b)=>a+b,0),TD=x.tg.reduce((a,v,j)=>a+(D.have[j]?v:0),0),el=D.have.filter(Boolean).length;
