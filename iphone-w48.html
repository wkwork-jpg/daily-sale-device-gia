function dayTable(title,sub,rows,days,have,tl,f=Q){
  const el=have.filter(Boolean).length;
  const head=`<thead><tr><th rowspan="2">GROUP</th><th rowspan="2" class="sep">${tl} Week</th><th rowspan="2">${tl}/Day</th>${days.map((d,j)=>`<th colspan="2" class="sep">${dw(d)} ${dTH(d)}</th>`).join('')}<th colspan="4" class="sep">TOTAL ${days.length} Days</th></tr><tr>${days.map(()=>`<th class="sep">ACTUAL</th><th>%ACH</th>`).join('')}<th class="sep">ACTUAL</th><th>${tl} To Date</th><th>%ACH To Date</th><th>%ACH vs ${tl} Week</th></tr></thead>`;
  const tr=(r,tag)=>{const TA=j=>Array.isArray(r.t)?r.t[j]:r.t,A=r.d.reduce((a,b,j)=>a+(have[j]?b:0),0),TN=Array.isArray(r.t)?r.t.reduce((a,b,j)=>a+(have[j]?b*dayTF(days[j]):0),0):r.t*el,T3=Array.isArray(r.t)?r.t.reduce((a,b)=>a+b,0):r.t*days.length,TD=T3/days.length;
    return `<tr${tag?' class="'+tag+'"':''}><td class="l">${r.lab}</td><td class="r sep"><b>${f(T3)}</b></td><td class="r">${TD<20?T1(TD):f(TD)}</td>${r.d.map((v,j)=>have[j]?`<td class="r sep${v===0?' z':''}"><b>${f(v)}</b></td><td class="c">${pct(TA(j)?v/TA(j):null)}</td>`:`<td class="r sep wait">–</td><td class="c wait">–</td>`).join('')}<td class="r sep"><b>${el?f(A):'–'}</b></td><td class="r">${el?(TN<20?T1(TN):f(TN)):'–'}</td><td class="c">${el?pct(TN?A/TN:null):'–'}</td><td class="c">${el?pct(T3?A/T3:null):'–'}</td></tr>`};
  const body=rows.slice(0,-1).map(r=>tr(r)).join(''),last=rows[rows.length-1];
