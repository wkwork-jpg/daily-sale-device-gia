  const body=rows.slice(0,-1).map(r=>tr(r)).join(''),last=rows[rows.length-1];
  return `<div class="title">${title}</div><div class="stt">${sub}</div><div class="scroll"><table class="xl fit">${head}<tbody>${body}</tbody><tfoot>${tr(last)}</tfoot></table></div>`}
